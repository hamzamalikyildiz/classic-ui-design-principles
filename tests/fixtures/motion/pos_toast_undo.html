<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positive Motion — Toast Enter/Exit with Undo</title>
  <style>
    :root {
      --dur-instant: 80ms;
      --dur-fast: 150ms;
      --dur-base: 220ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
      --ease-enter: cubic-bezier(0, 0, .2, 1);
      --ease-exit: cubic-bezier(.4, 0, 1, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { font-size: 1.375rem; margin-bottom: 0.75rem; }
    .btn {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--dur-instant) var(--ease-standard);
    }
    .btn:focus-visible, .undo-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .btn:active { transform: scale(0.98); }
    .toast-region {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 50;
    }
    .toast {
      background: #0f172a;
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--dur-base) var(--ease-enter), opacity var(--dur-base) var(--ease-enter);
    }
    .toast.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .toast.exit {
      opacity: 0;
      transform: translateY(6px);
      transition-duration: var(--dur-fast);
      transition-timing-function: var(--ease-exit);
    }
    .undo-btn {
      min-height: 2.25rem;
      padding: 0.25rem 0.75rem;
      border-radius: 0.375rem;
      border: 1px solid #475569;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 120ms !important;
        transition-property: opacity !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Application Archive</h1>
    <p style="color: #334155; margin-bottom: 1rem; font-size: 0.9375rem;">
      Archiving triggers an instant optimistic state change and a 220ms enter / 150ms exit Undo toast.
    </p>
    <button type="button" class="btn" id="archive-btn">Archive Candidate</button>
    <div class="toast-region" role="status" aria-live="polite">
      <div class="toast open" id="undo-toast" data-state="open">
        <span style="font-size: 0.875rem;">Candidate archived</span>
        <button type="button" class="undo-btn" id="undo-btn">Undo</button>
      </div>
    </div>
  </main>
  <script>
    const archiveBtn = document.getElementById('archive-btn');
    const undoBtn = document.getElementById('undo-btn');
    const toast = document.getElementById('undo-toast');
    archiveBtn.addEventListener('click', () => {
      toast.classList.remove('exit');
      toast.classList.add('open');
      toast.setAttribute('data-state', 'open');
    });
    undoBtn.addEventListener('click', () => {
      toast.classList.remove('open');
      toast.classList.add('exit');
      toast.setAttribute('data-state', 'closed');
    });
  </script>
</body>
</html>
