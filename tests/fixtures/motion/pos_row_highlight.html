<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positive Motion — Accepted Row Highlight Flash</title>
  <style>
    :root {
      --dur-instant: 80ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
      --ease-enter: cubic-bezier(0, 0, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    main { max-width: 40rem; margin: 0 auto; }
    h1 { font-size: 1.375rem; margin-bottom: 1rem; }
    .row {
      position: relative;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      overflow: hidden;
    }
    .row-ok::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(16, 185, 129, 0.18);
      animation: flash 1.2s var(--ease-enter) forwards;
      pointer-events: none;
    }
    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .btn {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--dur-instant) var(--ease-standard);
    }
    .btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .btn:active { transform: scale(0.98); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 120ms !important;
        transform: none !important;
      }
      .row-ok::after { animation: none !important; opacity: 0 !important; }
      .row-ok { border-left: 3px solid #059669; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Experience Bullet Revisions</h1>
    <div class="row" id="bullet-row">
      <div>
        <strong style="display: block; font-size: 0.9375rem;">Quantified latency improvement</strong>
        <span id="bullet-copy" style="color: #334155; font-size: 0.875rem;">
          Reduced p99 query latency by 42% across 14 regional clusters.
        </span>
      </div>
      <button type="button" class="btn" id="accept-btn">Accept Edit</button>
    </div>
  </main>
  <script>
    const row = document.getElementById('bullet-row');
    const btn = document.getElementById('accept-btn');
    btn.addEventListener('click', () => {
      row.classList.remove('row-ok');
      void row.offsetWidth;
      row.classList.add('row-ok');
      row.setAttribute('data-accepted', 'true');
      btn.textContent = 'Accepted';
    });
  </script>
</body>
</html>
