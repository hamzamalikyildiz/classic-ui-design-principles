<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negative Motion — Prefers-Reduced-Motion Ignored</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    main { max-width: 40rem; margin: 0 auto; }
    h1 { font-size: 1.375rem; margin-bottom: 1rem; }
    /* Anti-pattern: no @media (prefers-reduced-motion: reduce) rule, >300ms spatial travel */
    .sliding-banner {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 1.5rem;
      transform: translateX(0px);
      transition: transform 650ms cubic-bezier(0.2, 0, 0, 1);
      animation: slide-across 650ms cubic-bezier(0.2, 0, 0, 1) infinite alternate;
    }
    .sliding-banner.moved {
      transform: translateX(120px);
    }
    @keyframes slide-across {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(96px); }
    }
    .btn {
      margin-top: 1rem;
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 600ms ease;
    }
  </style>
</head>
<body>
  <main>
    <h1>Unconditional Spatial Motion</h1>
    <div class="sliding-banner" id="banner">
      <p>Runs a 650ms <code>transform: translateX(...)</code> animation even when <code>prefers-reduced-motion: reduce</code> is active.</p>
    </div>
    <button type="button" class="btn" id="slide-btn">Slide Banner</button>
  </main>
  <script>
    const banner = document.getElementById('banner');
    const btn = document.getElementById('slide-btn');
    btn.addEventListener('click', () => {
      banner.classList.toggle('moved');
    });
  </script>
</body>
</html>
