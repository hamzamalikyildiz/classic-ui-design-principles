<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negative Motion — Slow Click Feedback (&gt;100ms)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    main { max-width: 36rem; margin: 0 auto; }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 1.5rem;
    }
    h1 { font-size: 1.375rem; margin-bottom: 0.5rem; }
    p { color: #334155; margin-bottom: 1rem; }
    .btn {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Delayed Button Response</h1>
      <p id="status-text">Idle — click button to test delayed DOM feedback.</p>
      <button type="button" class="btn" id="slow-btn">Save Changes</button>
    </div>
  </main>
  <script>
    const btn = document.getElementById('slow-btn');
    const status = document.getElementById('status-text');
    btn.addEventListener('click', () => {
      /* Anti-pattern: no immediate visual/DOM feedback; waits 180ms (>100ms threshold) */
      setTimeout(() => {
        btn.setAttribute('data-state', 'saved');
        btn.textContent = 'Changes Saved';
        status.textContent = 'Updated after 180ms delay.';
      }, 180);
    });
  </script>
</body>
</html>
