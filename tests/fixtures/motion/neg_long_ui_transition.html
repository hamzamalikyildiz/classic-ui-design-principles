<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negative Motion — Long UI Transition (900ms &gt; 500ms)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
    }
    main { max-width: 38rem; margin: 0 auto; }
    h1 { font-size: 1.375rem; margin-bottom: 1rem; }
    /* Anti-pattern: simple button and modal UI feedback using 900ms (>500ms) transition */
    .slow-btn {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 900ms ease, opacity 900ms ease, background-color 900ms ease;
    }
    .slow-btn:hover, .slow-btn.active {
      transform: scale(0.95);
      background-color: #2563eb;
    }
    .modal-panel {
      margin-top: 1rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 1.5rem;
      opacity: 1;
      transform: translateY(0);
      transition: transform 900ms cubic-bezier(0.2, 0, 0, 1), opacity 900ms cubic-bezier(0.2, 0, 0, 1);
    }
    .modal-panel.toggled {
      transform: translateY(16px);
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sluggish 900ms UI Transition</h1>
    <button type="button" class="slow-btn" id="open-modal-btn">Toggle Modal Dialog</button>
    <div class="modal-panel" id="modal-panel" role="dialog" aria-label="Settings dialog">
      <p>This dialog and button use a sluggish <code>900ms</code> transition duration (exceeding the 500ms UI maximum).</p>
    </div>
  </main>
  <script>
    const btn = document.getElementById('open-modal-btn');
    const panel = document.getElementById('modal-panel');
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      panel.classList.toggle('toggled');
    });
  </script>
</body>
</html>
