<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Pipeline Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #0b0f14; color: #d6dde6; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .card { background: #111820; border: 1px solid #1d2733; border-radius: 12px; }
  .row-active { background: #16212d; box-shadow: inset 3px 0 0 #38bdf8; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .s-pass { background: #0f2e22; color: #4ade80; }
  .s-fail { background: #3a1517; color: #f87171; }
  .s-run  { background: #102a3d; color: #38bdf8; }
  .s-queued { background: #2a2411; color: #facc15; }
  .term { background: #070a0e; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-white">Pipeline <span class="text-sky-400">web-app / main</span></h1>
      <p class="text-sm text-slate-400">Last 24 hours &middot; updated just now</p>
    </div>
    <div class="flex gap-2 text-sm">
      <span class="card px-3 py-2"><span class="text-slate-400">Success</span> <b class="text-green-400 mono" id="rate">--</b></span>
      <span class="card px-3 py-2"><span class="text-slate-400">Median</span> <b class="text-white mono" id="median">--</b></span>
    </div>
  </header>

  <div class="grid lg:grid-cols-3 gap-6">

    <!-- Recent builds -->
    <section class="card lg:col-span-2 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-medium text-white">Recent builds</div>
      <ul id="builds" class="divide-y divide-slate-800"></ul>
    </section>

    <!-- Duration chart -->
    <section class="card p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-medium text-white">Build duration</h2>
        <span class="text-xs text-slate-500">minutes</span>
      </div>
      <svg id="chart" viewBox="0 0 300 180" class="w-full h-auto" role="img" aria-label="Build duration bar chart"></svg>
      <div class="flex justify-between text-[11px] text-slate-500 mono mt-1"><span>#1043</span><span>#1048</span></div>
    </section>
  </div>

  <div class="grid lg:grid-cols-3 gap-6">

    <!-- Flaky tests -->
    <section class="card overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-medium text-white">Flaky tests</div>
      <ul id="flaky" class="divide-y divide-slate-800 text-sm"></ul>
    </section>

    <!-- Deploy history -->
    <section class="card overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-medium text-white">Deploy history</div>
      <ol id="deploys" class="relative px-4 py-3 space-y-4 text-sm"></ol>
    </section>

    <!-- Terminal log -->
    <section class="card overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
        <span class="font-medium text-white">Log</span>
        <span class="mono text-xs text-slate-400" id="log-title"></span>
      </div>
      <div class="term p-4 flex-1 min-h-72 overflow-auto whitespace-pre-wrap" id="log" aria-live="polite"></div>
    </section>
  </div>
</div>

<script>
const builds = [
  { id: 1048, branch: 'main', commit: 'a91f2c3', author: 'mara', status: 'pass', mins: 6.4, ago: '4m ago',
    log: ['[info] checkout a91f2c3', '[info] npm ci (cache hit)', '[ok]   lint passed (0.8s)', '[ok]   unit 412/412 passed', '[ok]   e2e 58/58 passed', '[ok]   deployed to staging'] },
  { id: 1047, branch: 'main', commit: 'c03b7de', author: 'jon', status: 'fail', mins: 3.1, ago: '41m ago',
    log: ['[info] checkout c03b7de', '[ok]   lint passed (0.7s)', '[err]  unit 409/412 passed', '[err]  FAIL checkout.spec.ts > applies coupon', '[err]  Timeout 5000ms exceeded', '[err]  pipeline aborted (exit 1)'] },
  { id: 1046, branch: 'feat/cart', commit: '5e7d1aa', author: 'ines', status: 'run', mins: 2.2, ago: 'now',
    log: ['[info] checkout 5e7d1aa', '[info] npm ci (cache miss)', '[info] running unit tests...'] },
  { id: 1045, branch: 'main', commit: 'e44b910', author: 'mara', status: 'pass', mins: 7.0, ago: '2h ago',
    log: ['[info] checkout e44b910', '[ok]   lint passed (0.9s)', '[ok]   unit 412/412 passed', '[ok]   e2e 58/58 passed', '[ok]   deployed to production'] },
  { id: 1044, branch: 'fix/auth', commit: '0bd62f9', author: 'omar', status: 'queued', mins: 0, ago: '2h ago',
    log: ['[info] waiting for runner pool (position 2)'] },
  { id: 1043, branch: 'main', commit: 'f7a0c18', author: 'jon', status: 'pass', mins: 5.5, ago: '5h ago',
    log: ['[info] checkout f7a0c18', '[ok]   all stages passed', '[ok]   deployed to staging'] },
];

const flaky = [
  { name: 'checkout.spec.ts > applies coupon', rate: 18, runs: 50 },
  { name: 'search.e2e > debounced results', rate: 9, runs: 50 },
  { name: 'auth.spec.ts > refresh token', rate: 6, runs: 50 },
  { name: 'cart.unit > totals rounding', rate: 2, runs: 50 },
];

const deploys = [
  { env: 'production', ver: 'v2.14.0', who: 'mara', when: '2h ago', ok: true },
  { env: 'staging', ver: 'v2.15.0-rc1', who: 'mara', when: '4m ago', ok: true },
  { env: 'production', ver: 'v2.13.4', who: 'jon', when: 'yesterday', ok: false },
  { env: 'staging', ver: 'v2.13.4', who: 'jon', when: 'yesterday', ok: true },
];

const pillFor = { pass: ['s-pass', 'passed'], fail: ['s-fail', 'failed'], run: ['s-run', 'running'], queued: ['s-queued', 'queued'] };
let selected = builds[0].id;

const passCount = builds.filter(b => b.status === 'pass').length;
const finished = builds.filter(b => b.status === 'pass' || b.status === 'fail').length;
document.getElementById('rate').textContent = Math.round(passCount / finished * 100) + '%';
const durs = builds.filter(b => b.mins > 0).map(b => b.mins).sort((a, b) => a - b);
document.getElementById('median').textContent = durs[Math.floor(durs.length / 2)].toFixed(1) + 'm';

function renderBuilds() {
  const ul = document.getElementById('builds');
  ul.innerHTML = builds.map(b => {
    const [cls, label] = pillFor[b.status];
    const active = b.id === selected ? 'row-active' : 'hover:bg-slate-900/60';
    return `<li><button data-id="${b.id}" class="w-full text-left px-4 py-3 flex items-center gap-4 ${active}">
      <span class="pill ${cls} ${b.status === 'run' ? 'pulse' : ''}">${label}</span>
      <span class="mono text-white">#${b.id}</span>
      <span class="mono text-slate-400 text-sm">${b.branch}</span>
      <span class="mono text-slate-500 text-xs hidden sm:inline">${b.commit}</span>
      <span class="ml-auto text-sm text-slate-400 hidden sm:inline">${b.author}</span>
      <span class="mono text-sm w-16 text-right">${b.mins ? b.mins.toFixed(1) + 'm' : '--'}</span>
      <span class="text-xs text-slate-500 w-16 text-right">${b.ago}</span>
    </button></li>`;
  }).join('');
  ul.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    selected = Number(btn.dataset.id); renderBuilds(); renderLog();
  }));
}

function renderChart() {
  const svg = document.getElementById('chart');
  const max = Math.max(...builds.map(b => b.mins), 1);
  const bw = 300 / builds.length;
  svg.innerHTML = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="300" y1="${150 - 130 * f}" y2="${150 - 130 * f}" stroke="#1d2733"/>`).join('') +
    builds.slice().reverse().map((b, i) => {
      const h = b.mins ? (b.mins / max) * 130 : 2;
      const color = b.status === 'fail' ? '#f87171' : b.status === 'run' ? '#38bdf8' : b.status === 'queued' ? '#facc15' : '#4ade80';
      return `<rect x="${i * bw + 8}" y="${150 - h}" width="${bw - 16}" height="${h}" rx="3" fill="${color}" opacity="${b.id === selected ? 1 : 0.55}"><title>#${b.id}: ${b.mins}m</title></rect>`;
    }).join('') +
    `<line x1="0" x2="300" y1="150" y2="150" stroke="#334155"/>`;
}

function renderFlaky() {
  document.getElementById('flaky').innerHTML = flaky.map(t => `
    <li class="px-4 py-3">
      <div class="flex justify-between gap-2"><span class="mono text-slate-200 truncate">${t.name}</span><span class="text-amber-400 mono">${t.rate}%</span></div>
      <div class="mt-2 h-1.5 rounded bg-slate-800"><div class="h-1.5 rounded bg-amber-400" style="width:${t.rate * 4}%"></div></div>
      <div class="text-xs text-slate-500 mt-1">failed ${Math.round(t.rate / 100 * t.runs)} of last ${t.runs} runs</div>
    </li>`).join('');
}

function renderDeploys() {
  document.getElementById('deploys').innerHTML = deploys.map(d => `
    <li class="flex gap-3">
      <span class="mt-1 w-2.5 h-2.5 rounded-full shrink-0 ${d.ok ? 'bg-green-400' : 'bg-red-400'}"></span>
      <div class="min-w-0">
        <div class="text-white"><span class="mono">${d.ver}</span> <span class="text-slate-500">to</span> ${d.env}</div>
        <div class="text-xs text-slate-500">${d.who} &middot; ${d.when} &middot; ${d.ok ? 'healthy' : 'rolled back'}</div>
      </div>
    </li>`).join('');
}

function renderLog() {
  const b = builds.find(x => x.id === selected);
  document.getElementById('log-title').textContent = `#${b.id} / ${b.commit}`;
  const lines = b.log.map(l => {
    const color = l.includes('[err]') ? 'text-red-400' : l.includes('[ok]') ? 'text-green-400' : 'text-slate-400';
    return `<div class="${color}">${l.replace(/</g, '&lt;')}</div>`;
  });
  const cursor = b.status === 'run' ? '<span class="pulse text-sky-400">_</span>' : '';
  document.getElementById('log').innerHTML = lines.join('') + cursor;
}

renderBuilds(); renderChart(); renderFlaky(); renderDeploys(); renderLog();
</script>
</body>
</html>
