<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareDesk — Clinic Appointment & Pre-Authorization Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Lora', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            tealTrust: {
              900: '#0f4c5c',
              800: '#155e75',
              100: '#e0f2fe',
              50: '#f0f9ff',
            },
            porcelain: '#f4f8f9',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --dur-instant: 80ms;
      --dur-fast: 150ms;
      --dur-base: 220ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
      --ease-enter: cubic-bezier(0, 0, .2, 1);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #f4f8f9;
      color: #0f2933;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: 'Lora', Georgia, serif; }
    .metric { font-variant-numeric: tabular-nums; }
    .btn-tactile { transition: transform var(--dur-instant) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard); }
    .btn-tactile:active { transform: scale(0.98); }
    .row-ok { position: relative; }
    .row-ok::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(15, 76, 92, 0.14);
      animation: flash 1.2s var(--ease-enter) forwards;
      pointer-events: none;
    }
    @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
    .toast-el {
      transform: translateY(12px);
      opacity: 0;
      transition: transform var(--dur-base) var(--ease-enter), opacity var(--dur-base) var(--ease-enter);
    }
    .toast-el.open { transform: translateY(0); opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 120ms !important;
        transition-property: opacity, color, background-color, border-color !important;
        transform: none !important;
      }
      .row-ok::after { animation: none !important; opacity: 0 !important; }
      .row-ok { border-left: 3px solid #0f4c5c !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <main id="app" class="flex-1 flex flex-col"></main>

  <div id="toast" role="status" aria-live="polite" class="toast-el fixed bottom-5 right-5 z-50 hidden items-center gap-3 rounded-xl bg-tealTrust-900 px-4 py-3 text-sm text-white shadow-lg">
    <span id="toast-msg"></span>
    <button id="toast-undo" type="button" class="hidden rounded-lg bg-white/15 px-2.5 py-1 text-sm font-medium text-white hover:bg-white/25">Undo</button>
  </div>

  <script>
    (function () {
      const ROUTES = ['#/login', '#/list', '#/detail/1', '#/settings'];
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked', 'offline', 'stale'];

      const APPOINTMENTS = [
        { id: 1, time: '09:00 AM', patient: 'Marcus Vance', reason: 'Cardiology Follow-up', provider: 'Dr. S. Patel', auth: 'Pre-Auth Pending', status: 'Checked In' },
        { id: 2, time: '09:30 AM', patient: 'Amina Haddad', reason: 'Annual Preventive Exam', provider: 'Dr. L. Chen', auth: 'Verified', status: 'In Exam' },
        { id: 3, time: '10:15 AM', patient: 'Clara Lindqvist', reason: 'MRI Knee Consultation', provider: 'Dr. R. Torres', auth: 'Approved', status: 'Scheduled' },
        { id: 4, time: '11:00 AM', patient: 'David Okafor', reason: 'Post-Op Wound Check', provider: 'Dr. S. Patel', auth: 'Verified', status: 'Scheduled' },
        { id: 5, time: '11:45 AM', patient: 'Sofia Morales', reason: 'Endocrinology Lab Review', provider: 'Dr. L. Chen', auth: 'Verified', status: 'Completed' },
        { id: 6, time: '01:30 PM', patient: 'Thomas Wright', reason: 'Physical Therapy Eval', provider: 'Dr. R. Torres', auth: 'Pre-Auth Pending', status: 'Scheduled' }
      ];

      let appState = {
        route: '#/login',
        renderState: 'default',
        visitStatus: 'Checked In',
        noteText: 'Patient reports stable blood pressure (122/78 mmHg). Awaiting cardiology echo pre-authorization.',
        statusFlashed: false,
        longOp: { running: false, elapsed: 4, stage: 1 },
        longOpTimer: null,
        toastTimer: null
      };

      function getRequestedState() {
        if (typeof window.__RENDER_STATE__ === 'string' && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const q = new URLSearchParams(window.location.search).get('state');
        return (q && VALID_STATES.includes(q)) ? q : 'default';
      }

      function normalizeRoute(h) {
        return ROUTES.includes(h) ? h : '#/login';
      }

      function showToast(msg, onUndo) {
        const el = document.getElementById('toast');
        const msgEl = document.getElementById('toast-msg');
        const undoBtn = document.getElementById('toast-undo');
        msgEl.textContent = msg;
        el.classList.remove('hidden');
        el.classList.add('flex');
        requestAnimationFrame(() => el.classList.add('open'));
        if (onUndo) {
          undoBtn.classList.remove('hidden');
          undoBtn.onclick = () => { onUndo(); hideToast(); };
        } else {
          undoBtn.classList.add('hidden');
        }
        clearTimeout(appState.toastTimer);
        appState.toastTimer = setTimeout(hideToast, 4200);
      }

      function hideToast() {
        const el = document.getElementById('toast');
        el.classList.remove('open');
        setTimeout(() => { el.classList.add('hidden'); el.classList.remove('flex'); }, 160);
      }

      function navigate(hash) {
        if (window.location.hash !== hash) window.location.hash = hash;
        else { appState.route = normalizeRoute(hash); render(); }
      }

      function setRenderState(nextState) {
        appState.renderState = nextState;
        const url = new URL(window.location.href);
        url.searchParams.set('state', nextState);
        window.history.replaceState({}, '', url);
        render();
      }

      function badge(status) {
        const map = {
          'Checked In': 'bg-sky-50 text-sky-900 border-sky-200',
          'In Exam': 'bg-emerald-50 text-emerald-800 border-emerald-200',
          'Completed': 'bg-slate-100 text-slate-700 border-slate-200',
          'Scheduled': 'bg-amber-50 text-amber-800 border-amber-200'
        };
        return `<span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-sm font-medium shrink-0 ${map[status] || map['Scheduled']}">${status}</span>`;
      }

      function renderShell(contentHtml) {
        const st = appState.renderState;
        const nav = [
          { hash: '#/list', label: 'Daily Schedule' },
          { hash: '#/detail/1', label: 'Patient Visit' },
          { hash: '#/settings', label: 'Clinic Hours' }
        ];
        const banner = st === 'offline'
          ? `<div role="status" aria-live="polite" class="bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-sm text-amber-900 flex items-center justify-between">
              <span>Offline — showing cached clinic schedule from 2m ago.</span>
              <button type="button" onclick="window.__setState('default')" class="font-semibold underline">Retry</button>
            </div>`
          : st === 'stale'
          ? `<div role="status" aria-live="polite" class="bg-tealTrust-100 border-b border-tealTrust-200 px-4 py-2 text-sm text-tealTrust-900 flex items-center justify-between">
              <span>Updated 4m ago · Syncing EHR & Payer gateway</span>
              <button type="button" onclick="window.__setState('default')" class="font-medium underline">Refresh</button>
            </div>`
          : '';

        return `
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div class="flex items-center gap-6">
                <a href="#/list" class="flex items-center gap-2.5 font-display text-xl font-semibold text-tealTrust-900 rounded-lg">
                  <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                    <rect width="28" height="28" rx="8" fill="#0f4c5c"/>
                    <path d="M14 8V20M8 14H20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                  </svg>
                  <span>CareDesk</span>
                </a>
                <nav aria-label="Primary" class="hidden sm:flex items-center gap-1">
                  ${nav.map(n => `<a href="${n.hash}" class="px-3 py-2 rounded-lg text-sm font-medium ${appState.route === n.hash ? 'bg-tealTrust-100 text-tealTrust-900' : 'text-slate-600 hover:text-tealTrust-900 hover:bg-slate-100'}">${n.label}</a>`).join('')}
                </nav>
              </div>
              <div class="flex items-center gap-3">
                <label class="sr-only" for="state-select">Preview state</label>
                <select id="state-select" onchange="window.__setState(this.value)" class="h-10 rounded-lg border border-slate-300 bg-white px-2.5 text-sm text-slate-900">
                  ${VALID_STATES.map(s => `<option value="${s}" ${s === st ? 'selected' : ''}>State: ${s}</option>`).join('')}
                </select>
                <a href="#/login" class="text-sm font-medium text-slate-600 hover:text-tealTrust-900 px-2.5 py-2">Sign out</a>
              </div>
            </div>
          </header>
          ${banner}
          <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
            ${contentHtml}
          </main>
        `;
      }

      function renderLogin() {
        const st = appState.renderState;
        return `
          <main class="flex-1 flex items-center justify-center px-4 py-12 bg-porcelain">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
              <div class="flex items-center gap-2.5 mb-6">
                <svg width="32" height="32" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                  <rect width="28" height="28" rx="8" fill="#0f4c5c"/>
                  <path d="M14 8V20M8 14H20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                <span class="font-display text-2xl font-semibold text-tealTrust-900">CareDesk</span>
              </div>
              <h1 class="font-display text-2xl font-semibold text-slate-900 mb-2">Clinic Staff Sign-In</h1>
              <p class="text-sm text-slate-600 mb-6">Manage daily patient arrivals, clinical notes, and payer pre-authorizations.</p>
              ${st === 'error' ? `<div role="alert" class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-900">Invalid staff credentials. Your email is preserved.</div>` : ''}
              ${st === 'locked' ? `<div role="alert" class="mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">HIPAA session timeout. Re-authenticate to view patient records.</div>` : ''}
              <form onsubmit="event.preventDefault(); window.__nav('#/list');" class="space-y-4">
                <div>
                  <label for="cd-email" class="block text-sm font-medium text-slate-900 mb-1.5">Staff Email</label>
                  <input id="cd-email" type="email" value="intake@caredesk-clinic.org" required class="w-full h-11 rounded-lg border border-slate-300 px-3.5 text-sm" />
                </div>
                <div>
                  <label for="cd-pass" class="block text-sm font-medium text-slate-900 mb-1.5">Password</label>
                  <input id="cd-pass" type="password" value="••••••••••••" required class="w-full h-11 rounded-lg border border-slate-300 px-3.5 text-sm" />
                </div>
                <button type="submit" class="btn-tactile w-full h-11 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold hover:bg-tealTrust-800">
                  Sign in to Clinic
                </button>
              </form>
            </div>
          </main>
        `;
      }

      function renderList() {
        const st = appState.renderState;
        if (st === 'loading') {
          return renderShell(`
            <div aria-busy="true" class="space-y-6">
              <div class="h-8 w-56 bg-slate-200 rounded-lg animate-pulse" aria-hidden="true"></div>
              <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                ${[1,2,3,4].map(() => `<div class="h-12 bg-slate-100 rounded-lg animate-pulse" aria-hidden="true"></div>`).join('')}
              </div>
            </div>
          `);
        }
        if (st === 'empty') {
          return renderShell(`
            <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center max-w-xl mx-auto">
              <h1 class="font-display text-2xl font-semibold text-slate-900 mb-2">No appointments scheduled today</h1>
              <p class="text-sm text-slate-600 mb-6">Add a walk-in patient or switch to tomorrow's clinic roster.</p>
              <button type="button" onclick="window.__setState('default')" class="btn-tactile h-11 px-6 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold">Load Today's Roster</button>
            </div>
          `);
        }
        if (st === 'error') {
          return renderShell(`
            <div role="alert" class="bg-white rounded-2xl border border-red-200 p-8 max-w-xl mx-auto">
              <h1 class="font-display text-xl font-semibold text-red-900 mb-2">EHR Schedule Unavailable</h1>
              <p class="text-sm text-red-800 mb-5">Could not sync with the clinic EHR. Cached patient notes are preserved.</p>
              <button type="button" onclick="window.__setState('default')" class="btn-tactile h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold">Retry</button>
            </div>
          `);
        }
        if (st === 'locked') {
          return renderShell(`
            <div class="bg-white rounded-2xl border border-amber-200 p-8 max-w-xl mx-auto">
              <h1 class="font-display text-2xl font-semibold text-slate-900 mb-2">Clinical Roster Restricted</h1>
              <p class="text-sm text-slate-600 mb-6">Patient visit details require Clinical Staff or Front Desk clearance.</p>
              <a href="#/settings" class="btn-tactile inline-flex items-center h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold">Request Clearance</a>
            </div>
          `);
        }

        return renderShell(`
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
            <div>
              <h1 class="font-display text-3xl font-semibold text-slate-900">Daily Clinic Schedule</h1>
              <p class="text-sm text-slate-600 mt-1">Saturday, Nov 21 · 6 scheduled visits</p>
            </div>
            <a href="#/detail/1" class="btn-tactile inline-flex items-center justify-center h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold hover:bg-tealTrust-800 shrink-0">
              Open Next Check-In
            </a>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-tealTrust-900 text-white rounded-2xl p-6 shadow-sm">
              <p class="text-sm text-sky-100">Patients Checked In</p>
              <p class="font-display text-3xl font-semibold metric mt-1">${st === 'partial' ? '—' : '2 / 6'}</p>
              <p class="text-sm text-sky-100 mt-2">Avg wait time: 6 mins</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <p class="text-sm text-slate-600">Pre-Authorizations</p>
              <p class="font-display text-3xl font-semibold text-slate-900 metric mt-1">2 Pending</p>
              <p class="text-sm text-slate-600 mt-2">Marcus Vance · Thomas Wright</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <p class="text-sm text-slate-600">On-Duty Providers</p>
              <p class="font-display text-3xl font-semibold text-slate-900 metric mt-1">3</p>
              <p class="text-sm text-slate-600 mt-2">Patel, Chen, Torres</p>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 bg-slate-50 text-sm font-semibold text-slate-700">
                    <th class="py-3.5 px-6">Time</th>
                    <th class="py-3.5 px-4">Patient</th>
                    <th class="py-3.5 px-4">Visit Reason</th>
                    <th class="py-3.5 px-4">Payer Auth</th>
                    <th class="py-3.5 px-4">Status</th>
                    <th class="py-3.5 px-6 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-sm">
                  ${APPOINTMENTS.map(a => `
                    <tr class="hover:bg-slate-50/80">
                      <td class="py-4 px-6 font-mono font-medium text-tealTrust-900 metric">${a.time}</td>
                      <td class="py-4 px-4 font-semibold text-slate-900">${a.patient}</td>
                      <td class="py-4 px-4 text-slate-600">${a.reason}</td>
                      <td class="py-4 px-4 text-slate-700">${st === 'partial' && a.id === 1 ? '<span aria-label="Auth pending">—</span>' : a.auth}</td>
                      <td class="py-4 px-4">${badge(a.status)}</td>
                      <td class="py-4 px-6 text-right"><a href="#/detail/1" class="font-semibold text-tealTrust-900 underline">Open</a></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `);
      }

      function renderDetail() {
        const st = appState.renderState;
        if (st === 'loading') {
          return renderShell(`<div aria-busy="true" class="h-64 bg-white rounded-2xl border border-slate-200 p-6 animate-pulse"></div>`);
        }

        if (st === 'long-loading' || appState.longOp.running) {
          const stages = [
            { label: 'Verifying patient policy & CPT 93306 code', done: appState.longOp.stage > 0 },
            { label: 'Submitting clinical justification to payer portal', done: appState.longOp.stage > 1 },
            { label: 'Recording pre-authorization approval number', done: appState.longOp.stage > 2 }
          ];
          return renderShell(`
            <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8" role="status" aria-live="polite">
              <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center rounded-full bg-tealTrust-100 px-3 py-1 text-sm font-medium text-tealTrust-900">Insurance Pre-Authorization</span>
                <span class="text-sm font-mono text-slate-600 metric">Elapsed ${appState.longOp.elapsed}s · Usually 10–20s</span>
              </div>
              <h1 class="font-display text-2xl font-semibold text-slate-900 mb-2">Authorizing Cardiology Echo — Marcus Vance</h1>
              <p class="text-sm text-slate-600 mb-6">Connecting to payer clearinghouse for real-time medical necessity approval.</p>
              <div class="space-y-3 mb-6">
                ${stages.map((s, idx) => `
                  <div class="flex items-center gap-3 p-3.5 rounded-xl border ${s.done ? 'border-emerald-200 bg-emerald-50/50' : idx === appState.longOp.stage ? 'border-tealTrust-900 bg-tealTrust-50' : 'border-slate-200 opacity-60'}">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center text-sm font-semibold ${s.done ? 'bg-emerald-700 text-white' : idx === appState.longOp.stage ? 'bg-tealTrust-900 text-white' : 'bg-slate-200 text-slate-600'}">${s.done ? '✓' : idx + 1}</span>
                    <span class="text-sm font-medium text-slate-900">${s.label}</span>
                  </div>
                `).join('')}
              </div>
              <div class="flex items-center gap-3">
                <button type="button" onclick="window.__cancelLongOp()" class="btn-tactile h-11 px-5 rounded-lg border border-slate-300 bg-white text-sm font-semibold text-slate-900">Cancel</button>
                <button type="button" onclick="window.__notifyLongOp()" class="btn-tactile h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold">Notify when ready</button>
              </div>
            </div>
          `);
        }

        return renderShell(`
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <a href="#/list" class="text-sm font-medium text-slate-600 hover:text-tealTrust-900">← Back to Schedule</a>
              <h1 class="font-display text-2xl sm:text-3xl font-semibold text-slate-900 mt-1">Marcus Vance · 09:00 AM</h1>
            </div>
            <div class="flex items-center gap-3">
              <button type="button" onclick="window.__startLongOp()" class="btn-tactile h-11 px-4 rounded-lg border border-slate-300 bg-white text-sm font-semibold text-slate-900 hover:bg-slate-50">
                Run Insurance Pre-Auth
              </button>
              <button type="button" data-motion-trigger="true" onclick="window.__advanceVisitStatus()" class="btn-tactile h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold hover:bg-tealTrust-800">
                Move to In Exam
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-tealTrust-900 text-white rounded-2xl p-6 shadow-sm ${appState.statusFlashed ? 'row-ok' : ''}">
              <p class="text-sm text-sky-100 font-medium">Current Visit Status</p>
              <div id="visit-status-display" aria-live="polite" class="font-display text-3xl font-semibold mt-2">${appState.visitStatus}</div>
              <p class="text-sm text-sky-100 mt-3">Provider: Dr. S. Patel · Room 4B</p>
              <p class="text-sm text-sky-100 mt-1">Reason: Cardiology Follow-up</p>
            </div>

            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
              <label for="clinical-note" class="block text-base font-semibold text-slate-900 mb-2">Clinical Intake Note</label>
              <textarea id="clinical-note" rows="4" class="w-full rounded-xl border border-slate-300 p-3.5 text-sm text-slate-900">${appState.noteText}</textarea>
              <div class="mt-4 flex justify-end">
                <button type="button" onclick="window.__saveNote()" class="btn-tactile h-11 px-5 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold hover:bg-tealTrust-800">
                  Save Clinical Note
                </button>
              </div>
            </div>
          </div>
        `);
      }

      function renderSettings() {
        return renderShell(`
          <div class="max-w-2xl">
            <h1 class="font-display text-3xl font-semibold text-slate-900 mb-2">Clinic Hours & Notifications</h1>
            <p class="text-sm text-slate-600 mb-6">Configure operating hours and automated patient SMS reminders.</p>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
              <div>
                <label for="clinic-hours" class="block text-sm font-medium text-slate-900 mb-1.5">Standard Clinic Hours</label>
                <input id="clinic-hours" type="text" value="Mon–Sat, 08:00 AM – 06:00 PM" class="w-full h-11 rounded-lg border border-slate-300 px-3.5 text-sm" />
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                <div>
                  <p class="text-sm font-semibold text-slate-900">Notify staff when Pre-Auth approves</p>
                  <p class="text-sm text-slate-600">Send real-time alert to front desk console</p>
                </div>
                <input type="checkbox" checked aria-label="Notify staff when Pre-Auth approves" class="w-5 h-5 accent-tealTrust-900" />
              </div>
              <button type="button" onclick="window.__saveSettings()" class="btn-tactile h-11 px-6 rounded-lg bg-tealTrust-900 text-white text-sm font-semibold hover:bg-tealTrust-800">
                Save Clinic Settings
              </button>
            </div>
          </div>
        `);
      }

      function render() {
        const root = document.getElementById('app');
        if (appState.route === '#/login') root.innerHTML = renderLogin();
        else if (appState.route === '#/list') root.innerHTML = renderList();
        else if (appState.route === '#/detail/1') root.innerHTML = renderDetail();
        else if (appState.route === '#/settings') root.innerHTML = renderSettings();
        else root.innerHTML = renderLogin();
      }

      window.__nav = navigate;
      window.__setState = setRenderState;
      window.__advanceVisitStatus = function () {
        const prev = appState.visitStatus;
        appState.visitStatus = 'In Exam';
        appState.statusFlashed = true;
        render();
        showToast('Patient moved to In Exam', () => {
          appState.visitStatus = prev;
          appState.statusFlashed = false;
          render();
        });
      };
      window.__saveNote = function () {
        const el = document.getElementById('clinical-note');
        if (el) appState.noteText = el.value;
        showToast('Clinical note saved to EHR');
      };
      window.__startLongOp = function () {
        appState.longOp = { running: true, elapsed: 1, stage: 0 };
        render();
        clearInterval(appState.longOpTimer);
        appState.longOpTimer = setInterval(() => {
          appState.longOp.elapsed += 1;
          if (appState.longOp.elapsed === 3) appState.longOp.stage = 1;
          if (appState.longOp.elapsed === 6) appState.longOp.stage = 2;
          if (appState.longOp.elapsed >= 9) {
            clearInterval(appState.longOpTimer);
            appState.longOp.running = false;
            render();
            showToast('Pre-Authorization Approved (#PA-88412)');
          } else render();
        }, 1000);
      };
      window.__cancelLongOp = function () {
        clearInterval(appState.longOpTimer);
        appState.longOp.running = false;
        if (appState.renderState === 'long-loading') setRenderState('default');
        else render();
        showToast('Pre-Authorization cancelled');
      };
      window.__notifyLongOp = function () {
        clearInterval(appState.longOpTimer);
        appState.longOp.running = false;
        if (appState.renderState === 'long-loading') setRenderState('default');
        else render();
        showToast('We will notify you when Pre-Auth completes');
      };
      window.__saveSettings = function () { showToast('Clinic settings saved'); };

      window.addEventListener('hashchange', () => {
        appState.route = normalizeRoute(window.location.hash);
        appState.renderState = getRequestedState();
        render();
      });

      appState.route = normalizeRoute(window.location.hash);
      appState.renderState = getRequestedState();
      render();
    })();
  </script>
</body>
</html>
