<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZestWeek — Weekly Meal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFBF2; color: #292524; }
    h1, h2, .brand-font { font-family: 'Fredoka', system-ui, sans-serif; }
    @keyframes bounce-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .pop-animate { animation: bounce-pop 0.4s ease-out; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    (function () {
      const ROUTES = ['#/login', '#/list', '#/detail/1', '#/settings'];
      const STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];

      let servings = 2;
      let popActive = false;
      let groceryTimer = null;
      let groceryOp = { running: false, step: 0, progress: 0, done: false, cancelled: false };

      const MEALS = [
        { day: 'Monday', title: 'Lemon Herb Sheet-Pan Salmon', prep: '25 min', cal: '520 kcal', tag: 'High Protein', color: 'bg-amber-100 text-amber-900 border-amber-200' },
        { day: 'Tuesday', title: 'Crispy Chickpea & Tahini Bowl', prep: '20 min', cal: '460 kcal', tag: 'Plant-Forward', color: 'bg-emerald-100 text-emerald-900 border-emerald-200' },
        { day: 'Wednesday', title: 'Honey Garlic Ginger Noodles', prep: '15 min', cal: '490 kcal', tag: 'Quick', color: 'bg-orange-100 text-orange-900 border-orange-200' },
        { day: 'Thursday', title: 'Roasted Tomato & Burrata Pasta', prep: '30 min', cal: '580 kcal', tag: 'Comfort', color: 'bg-rose-100 text-rose-900 border-rose-200' },
      ];

      const INGREDIENTS = [
        { name: 'Wild salmon fillets', qty: 150, unit: 'g' },
        { name: 'Baby potatoes, halved', qty: 200, unit: 'g' },
        { name: 'Fresh lemon juice', qty: 1.5, unit: 'tbsp' },
        { name: 'Extra-virgin olive oil', qty: 1, unit: 'tbsp' },
        { name: 'Chopped dill & parsley', qty: 2, unit: 'tbsp' }
      ];

      function getState() {
        if (typeof window.__RENDER_STATE__ === 'string' && STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const s = new URLSearchParams(window.location.search).get('state');
        return STATES.includes(s) ? s : 'default';
      }

      function getRoute() {
        const h = window.location.hash;
        return ROUTES.includes(h) ? h : '#/login';
      }

      function setStateParam(state) {
        window.__RENDER_STATE__ = state;
        const url = new URL(window.location.href);
        url.searchParams.set('state', state);
        window.history.replaceState({}, '', url.toString());
        render();
      }

      function renderOverlay(state, route) {
        if (state === 'loading') {
          return `
            <div class="space-y-4">
              <div class="h-8 w-48 bg-amber-200/60 rounded-xl animate-pulse"></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="h-32 bg-amber-100/80 rounded-2xl animate-pulse"></div>
                <div class="h-32 bg-amber-100/80 rounded-2xl animate-pulse"></div>
              </div>
            </div>
          `;
        }
        if (state === 'long-loading') {
          return `
            <div class="bg-white border-2 border-amber-200 rounded-3xl p-8 max-w-md mx-auto my-8 text-center shadow-sm">
              <div class="w-11 h-11 rounded-full border-4 border-orange-400 border-t-transparent animate-spin mx-auto mb-4"></div>
              <h2 class="text-xl font-semibold text-stone-900">Warming up your pantry…</h2>
              <p class="text-sm text-stone-600 mt-1">Matching seasonal recipes for <span class="font-semibold">${route}</span>.</p>
            </div>
          `;
        }
        if (state === 'error') {
          return `
            <div class="bg-rose-50 border-2 border-rose-200 rounded-3xl p-6 max-w-lg mx-auto my-8">
              <h2 class="text-lg font-semibold text-rose-900">Oops! Kitchen sync hiccup</h2>
              <p class="text-sm text-rose-700 mt-1">We couldn't load your meal plan right now. Please try again in a moment.</p>
              <button onclick="window.location.reload()" class="mt-4 px-4 py-2 rounded-full bg-rose-600 text-white text-xs font-semibold">Try Again</button>
            </div>
          `;
        }
        if (state === 'locked') {
          return `
            <div class="bg-white border-2 border-amber-300 rounded-3xl p-8 max-w-md mx-auto my-8 text-center">
              <h2 class="text-xl font-semibold text-stone-900">Family Plan Paused</h2>
              <p class="text-sm text-stone-600 mt-1.5">Sign in with the household owner account to unlock weekly editing.</p>
              <a href="#/login" class="inline-block mt-5 px-5 py-2.5 rounded-full bg-orange-500 text-white font-semibold text-sm">Go to Sign In</a>
            </div>
          `;
        }
        if (state === 'empty') {
          return `
            <div class="bg-white border-2 border-dashed border-amber-300 rounded-3xl p-10 text-center max-w-md mx-auto my-8">
              <h2 class="text-lg font-semibold text-stone-900">Your week is wide open!</h2>
              <p class="text-sm text-stone-600 mt-1">Add your first recipe to start building a fresh grocery list.</p>
              <a href="#/detail/1" class="inline-block mt-4 px-5 py-2.5 rounded-full bg-emerald-500 text-white font-semibold text-sm">View Featured Recipe</a>
            </div>
          `;
        }
        return null;
      }

      function renderShell(route, state, content) {
        if (route === '#/login') {
          return `
            <header class="px-6 py-4 flex items-center justify-between border-b border-amber-200/80 bg-white/80">
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-orange-500 text-white flex items-center justify-center font-bold brand-font">Z</span>
                <span class="brand-font text-xl font-semibold text-stone-900">ZestWeek</span>
              </div>
              <select id="state-switcher" aria-label="Render State" class="bg-amber-50 border border-amber-200 rounded-full px-3 py-1 text-xs font-medium text-stone-700">
                ${STATES.map(s => `<option value="${s}" ${s === state ? 'selected' : ''}>state=${s}</option>`).join('')}
              </select>
            </header>
            <main class="flex-1 flex items-center justify-center p-6">${content}</main>
          `;
        }

        const nav = [
          { href: '#/list', label: 'This Week' },
          { href: '#/detail/1', label: 'Recipe #1' },
          { href: '#/settings', label: 'Pantry' }
        ];

        return `
          <header class="bg-white/90 backdrop-blur border-b border-amber-200/80 sticky top-0 z-20">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-3 sm:gap-6">
                <a href="#/list" class="flex items-center gap-2">
                  <span class="w-8 h-8 rounded-xl bg-orange-600 text-white flex items-center justify-center font-bold brand-font">Z</span>
                  <span class="brand-font text-xl font-semibold text-stone-900">ZestWeek</span>
                </a>
                <nav class="flex items-center gap-1.5">
                  ${nav.map(n => `
                    <a href="${n.href}" class="px-3.5 py-1.5 rounded-full text-sm font-medium transition ${route === n.href ? 'bg-orange-600 text-white shadow-sm' : 'text-stone-700 hover:bg-amber-100'}">${n.label}</a>
                  `).join('')}
                </nav>
              </div>
              <div class="flex items-center gap-2.5">
                <select id="state-switcher" aria-label="Render State" class="bg-amber-50 border border-amber-200 rounded-full px-3 py-1 text-xs font-medium text-stone-700">
                  ${STATES.map(s => `<option value="${s}" ${s === state ? 'selected' : ''}>state=${s}</option>`).join('')}
                </select>
                <a href="#/login" class="text-xs font-medium text-stone-500 hover:text-stone-900 px-2.5 py-1">Log out</a>
              </div>
            </div>
          </header>
          <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-7">${content}</main>
        `;
      }

      function renderLogin(state) {
        const overlay = renderOverlay(state, '#/login');
        if (overlay) return overlay;
        return `
          <div class="w-full max-w-md bg-white border-2 border-amber-200 rounded-3xl p-8 shadow-sm">
            <h1 class="text-2xl font-semibold text-stone-900">Welcome back, Chef!</h1>
            <p class="text-sm text-stone-600 mt-1">Sign in to plan delicious, stress-free weeknight dinners.</p>
            <form id="login-form" class="mt-6 space-y-4">
              <div>
                <label for="meal-email" class="block text-xs font-semibold text-stone-700 mb-1">Email</label>
                <input id="meal-email" type="email" value="maya@zestweek.app" class="w-full rounded-2xl border border-amber-200 bg-amber-50/40 px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400" />
              </div>
              <div>
                <label for="meal-password" class="block text-xs font-semibold text-stone-700 mb-1">Password</label>
                <input id="meal-password" type="password" value="••••••••••" class="w-full rounded-2xl border border-amber-200 bg-amber-50/40 px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400" />
              </div>
              <button type="submit" class="w-full py-3 rounded-full bg-orange-600 hover:bg-orange-700 text-white font-semibold text-sm transition">Open My Meal Plan</button>
            </form>
          </div>
        `;
      }

      function renderList(state) {
        const overlay = renderOverlay(state, '#/list');
        if (overlay) return overlay;
        const meals = state === 'partial' ? MEALS.slice(0, 2) : MEALS;
        return `
          <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 class="text-2xl font-semibold text-stone-900">This Week's Menu</h1>
                <p class="text-sm text-stone-600">4 balanced dinners · Average prep 22 mins</p>
              </div>
              <a href="#/detail/1" class="px-5 py-2.5 rounded-full bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold transition">Cook Monday's Meal</a>
            </div>
            ${state === 'partial' ? '<div class="px-4 py-2.5 rounded-2xl bg-amber-100 border border-amber-300 text-xs text-amber-900">Partial week: Thursday &amp; Friday are still open for leftovers.</div>' : ''}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${meals.map(m => `
                <a href="#/detail/1" class="block bg-white border-2 border-amber-200/80 hover:border-orange-400 rounded-3xl p-5 transition shadow-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-orange-600">${m.day}</span>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${m.color}">${m.tag}</span>
                  </div>
                  <h2 class="text-lg font-semibold text-stone-900 mt-2">${m.title}</h2>
                  <div class="flex items-center gap-4 text-xs text-stone-500 mt-3">
                    <span>Prep: ${m.prep}</span>
                    <span>•</span>
                    <span>${m.cal}</span>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderDetail(state) {
        const overlay = renderOverlay(state, '#/detail/1');
        if (overlay) return overlay;
        const stages = ['Scanning recipe ingredients', 'Checking pantry staples', 'Grouping by grocery aisle'];
        const list = state === 'partial' ? INGREDIENTS.slice(0, 3) : INGREDIENTS;

        return `
          <div class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-orange-600">Monday · 25 min prep</span>
                <h1 class="text-2xl font-semibold text-stone-900 mt-0.5">Lemon Herb Sheet-Pan Salmon</h1>
              </div>
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-white border-2 border-amber-200 rounded-full px-3 py-1.5">
                  <span class="text-xs font-semibold text-stone-600">Servings:</span>
                  <button id="serving-dec" class="w-6 h-6 rounded-full bg-amber-100 hover:bg-amber-200 font-bold text-sm">-</button>
                  <span class="font-bold text-sm w-5 text-center ${popActive ? 'pop-animate text-orange-600' : ''}">${servings}</span>
                  <button id="serving-inc" data-motion-trigger class="w-6 h-6 rounded-full bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm">+</button>
                </div>
                <button id="grocery-btn" ${groceryOp.running ? 'disabled' : ''} class="px-4 py-2 rounded-full bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold disabled:opacity-50">
                  ${groceryOp.running ? 'Generating…' : 'Generate Grocery List (>3s)'}
                </button>
              </div>
            </div>

            ${groceryOp.running || groceryOp.done || groceryOp.cancelled ? `
              <div class="bg-white border-2 border-emerald-300 rounded-3xl p-5 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-semibold text-stone-900">
                    ${groceryOp.cancelled ? 'Grocery list generation cancelled' : groceryOp.done ? 'Grocery List Ready! (12 items grouped by aisle)' : `Step ${groceryOp.step + 1}/3: ${stages[groceryOp.step]}`}
                  </span>
                  ${groceryOp.running ? `<button id="grocery-cancel" class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-semibold">Cancel</button>` : ''}
                </div>
                <div class="w-full bg-amber-100 rounded-full h-2.5 overflow-hidden">
                  <div class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: ${groceryOp.progress}%"></div>
                </div>
              </div>
            ` : ''}

            <div class="bg-white border-2 border-amber-200 rounded-3xl p-6">
              <h2 class="text-lg font-semibold text-stone-900 mb-4">Ingredients (scaled for ${servings} servings)</h2>
              <ul class="divide-y divide-amber-100">
                ${list.map(ing => `
                  <li class="py-2.5 flex items-center justify-between text-sm">
                    <span class="text-stone-800">${ing.name}</span>
                    <span class="font-semibold text-orange-700">${+(ing.qty * (servings / 2)).toFixed(1)} ${ing.unit}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      function renderSettings(state) {
        const overlay = renderOverlay(state, '#/settings');
        if (overlay) return overlay;
        return `
          <div class="max-w-2xl space-y-6">
            <div>
              <h1 class="text-2xl font-semibold text-stone-900">Dietary &amp; Pantry Preferences</h1>
              <p class="text-sm text-stone-600">Customize your weekly suggestions and staples you always keep stocked.</p>
            </div>
            <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 space-y-4">
              <label class="flex items-center justify-between py-2 border-b border-amber-100">
                <span class="text-sm font-medium text-stone-800">Pescatarian &amp; Mediterranean focus</span>
                <input type="checkbox" checked class="w-4 h-4 accent-orange-500" />
              </label>
              <label class="flex items-center justify-between py-2 border-b border-amber-100">
                <span class="text-sm font-medium text-stone-800">Exclude tree nuts</span>
                <input type="checkbox" class="w-4 h-4 accent-orange-500" />
              </label>
              <div class="pt-2 flex justify-end">
                <button type="button" class="px-5 py-2 rounded-full bg-orange-600 text-white text-sm font-semibold">Save Preferences</button>
              </div>
            </div>
          </div>
        `;
      }

      function startGroceryOp() {
        if (groceryTimer) clearInterval(groceryTimer);
        groceryOp = { running: true, step: 0, progress: 15, done: false, cancelled: false };
        render();
        groceryTimer = setInterval(() => {
          if (!groceryOp.running) return;
          groceryOp.progress = Math.min(100, groceryOp.progress + 18);
          if (groceryOp.progress >= 40 && groceryOp.step === 0) groceryOp.step = 1;
          if (groceryOp.progress >= 75 && groceryOp.step === 1) groceryOp.step = 2;
          if (groceryOp.progress >= 100) {
            groceryOp.running = false;
            groceryOp.done = true;
            clearInterval(groceryTimer);
          }
          render();
        }, 700);
      }

      function render() {
        const route = getRoute();
        const state = getState();
        let body = '';
        if (route === '#/login') body = renderLogin(state);
        else if (route === '#/list') body = renderList(state);
        else if (route === '#/detail/1') body = renderDetail(state);
        else body = renderSettings(state);

        document.getElementById('app').innerHTML = renderShell(route, state, body);

        const switcher = document.getElementById('state-switcher');
        if (switcher) switcher.addEventListener('change', e => setStateParam(e.target.value));

        const loginForm = document.getElementById('login-form');
        if (loginForm) loginForm.addEventListener('submit', e => { e.preventDefault(); window.location.hash = '#/list'; });

        const incBtn = document.getElementById('serving-inc');
        if (incBtn) {
          incBtn.addEventListener('click', () => {
            servings = Math.min(12, servings + 1);
            popActive = true;
            render();
            setTimeout(() => { popActive = false; }, 450);
          });
        }
        const decBtn = document.getElementById('serving-dec');
        if (decBtn) {
          decBtn.addEventListener('click', () => {
            servings = Math.max(1, servings - 1);
            render();
          });
        }

        const groceryBtn = document.getElementById('grocery-btn');
        if (groceryBtn) groceryBtn.addEventListener('click', startGroceryOp);

        const cancelBtn = document.getElementById('grocery-cancel');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            if (groceryTimer) clearInterval(groceryTimer);
            groceryOp = { running: false, step: 0, progress: 0, done: false, cancelled: true };
            render();
          });
        }
      }

      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      if (document.readyState !== 'loading') render();
    })();
  </script>
</body>
</html>
