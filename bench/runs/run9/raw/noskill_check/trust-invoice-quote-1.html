<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BillCraft — Invoicing & Quoting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    @keyframes totalFlash {
      0% { transform: scale(1); }
      35% { transform: scale(1.08); color: #059669; }
      100% { transform: scale(1); }
    }
    .total-pop {
      animation: totalFlash 0.6s ease-out;
    }
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    (function () {
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];
      const ROUTES = ['#/login', '#/list', '#/detail/1', '#/settings'];

      let appState = {
        taxRate: 0.18,
        totalUpdated: false,
        invoices: [
          { id: 1, number: 'INV-2026-041', client: 'Northstar Logistics GmbH', amount: 4850.00, due: 'Due in 5 days', status: 'Pending' },
          { id: 2, number: 'QT-2026-118', client: 'Kestrel Robotics Inc.', amount: 12400.00, due: 'Quote valid 14d', status: 'Quote Sent' },
          { id: 3, number: 'INV-2026-039', client: 'Vanguard Retail Ltd.', amount: 2190.00, due: 'Overdue 3 days', status: 'Overdue' },
          { id: 4, number: 'INV-2026-035', client: 'Solstice Energy', amount: 8900.00, due: 'Paid Apr 12', status: 'Paid' }
        ],
        lineItems: [
          { id: 1, desc: 'Platform Architecture & API Integration', qty: 24, rate: 150 },
          { id: 2, desc: 'Compliance & E-Invoice Webhook Setup', qty: 1, rate: 1250 }
        ],
        signing: {
          running: false,
          progress: 0,
          elapsed: 0,
          step: 'Ready',
          timerId: null
        }
      };

      function getEffectiveState() {
        if (typeof window.__RENDER_STATE__ === 'string' && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const q = new URLSearchParams(window.location.search).get('state');
        if (q && VALID_STATES.includes(q)) return q;
        return 'default';
      }

      function getEffectiveRoute() {
        const h = window.location.hash;
        return ROUTES.includes(h) ? h : '#/login';
      }

      function calcSubtotal() {
        return appState.lineItems.reduce((sum, item) => sum + item.qty * item.rate, 0);
      }

      function addLineItemAndRecalculate() {
        appState.lineItems.push({
          id: Date.now(),
          desc: 'Priority SLA & Audit Support',
          qty: 1,
          rate: 450
        });
        appState.totalUpdated = true;
        render();
        setTimeout(() => { appState.totalUpdated = false; }, 700);
      }

      function startSigning() {
        if (appState.signing.running) return;
        appState.signing.running = true;
        appState.signing.progress = 15;
        appState.signing.elapsed = 0.5;
        appState.signing.step = 'Step 1/3: Rendering PDF/A-3b document...';
        render();

        appState.signing.timerId = setInterval(() => {
          appState.signing.elapsed = +(appState.signing.elapsed + 0.5).toFixed(1);
          appState.signing.progress = Math.min(100, Math.round((appState.signing.elapsed / 4.5) * 100));
          if (appState.signing.elapsed < 1.5) {
            appState.signing.step = 'Step 1/3: Rendering PDF/A-3b document...';
          } else if (appState.signing.elapsed < 3.0) {
            appState.signing.step = 'Step 2/3: Applying qualified e-invoice XAdES signature...';
          } else if (appState.signing.elapsed < 4.5) {
            appState.signing.step = 'Step 3/3: Registering hash with tax gateway...';
          } else {
            clearInterval(appState.signing.timerId);
            appState.signing.running = false;
            appState.signing.progress = 100;
            appState.signing.step = 'Signed & archived (PDF + XML ready)';
          }
          render();
        }, 500);
      }

      function cancelSigning() {
        if (appState.signing.timerId) clearInterval(appState.signing.timerId);
        appState.signing.running = false;
        appState.signing.progress = 0;
        appState.signing.elapsed = 0;
        appState.signing.step = 'Cancelled';
        render();
      }

      function renderHeader(route) {
        if (route === '#/login') return '';
        const nav = [
          { href: '#/list', label: 'Invoices & Quotes' },
          { href: '#/detail/1', label: 'INV-2026-041' },
          { href: '#/settings', label: 'Tax & Company' }
        ];
        return `
          <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              <div class="flex items-center gap-6">
                <a href="#/list" class="flex items-center gap-2 font-bold text-slate-900">
                  <svg class="w-5 h-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />
                  </svg>
                  <span>BillCraft</span>
                </a>
                <nav class="hidden sm:flex items-center gap-1">
                  ${nav.map(n => `
                    <a href="${n.href}" class="px-3 py-1.5 rounded-md text-sm font-medium ${route === n.href ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-100'}">${n.label}</a>
                  `).join('')}
                </nav>
              </div>
              <a href="#/login" class="text-xs font-medium text-slate-500 hover:text-slate-800">Sign out</a>
            </div>
          </header>
        `;
      }

      function renderStateBanner(state) {
        if (state === 'default') return '';
        const map = {
          'empty': 'bg-slate-100 text-slate-700 border-slate-300',
          'loading': 'bg-emerald-50 text-emerald-800 border-emerald-200',
          'long-loading': 'bg-amber-50 text-amber-900 border-amber-200',
          'error': 'bg-rose-50 text-rose-800 border-rose-200',
          'partial': 'bg-amber-50 text-amber-800 border-amber-200',
          'locked': 'bg-slate-800 text-slate-100 border-slate-700'
        };
        return `<div class="border-b px-4 py-2 text-xs font-medium ${map[state]}"><div class="max-w-6xl mx-auto">State: ${state}</div></div>`;
      }

      function renderLogin(state) {
        const locked = state === 'locked';
        return `
          <main class="flex-1 flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
              <h1 class="text-xl font-bold text-slate-900">BillCraft</h1>
              <p class="text-xs text-slate-500 mt-1 mb-6">B2B Invoicing, Quotes & E-Invoice Signing</p>
              ${state === 'error' ? `<div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-700">Gateway timeout. Please retry.</div>` : ''}
              <form onsubmit="event.preventDefault(); window.location.hash='#/list';" class="space-y-4">
                <div>
                  <label for="bill-email" class="block text-xs font-medium text-slate-700 mb-1">Billing Email</label>
                  <input id="bill-email" type="email" value="finance@northstar.io" ${locked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
                </div>
                <div>
                  <label for="bill-pass" class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                  <input id="bill-pass" type="password" value="••••••••" ${locked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
                </div>
                <button type="submit" ${locked ? 'disabled' : ''} class="w-full py-2.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold disabled:opacity-50">
                  Sign in
                </button>
              </form>
            </div>
          </main>
        `;
      }

      function renderList(state) {
        if (state === 'loading') {
          return `<main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 space-y-3">${[1,2,3].map(()=>`<div class="h-16 skeleton rounded-xl"></div>`).join('')}</main>`;
        }
        if (state === 'empty') {
          return `<main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-16 text-center"><p class="text-sm text-slate-500">No invoices or quotes found.</p></main>`;
        }
        const badge = (s) => {
          if (s === 'Paid') return 'bg-emerald-50 text-emerald-700';
          if (s === 'Overdue') return 'bg-rose-50 text-rose-700';
          if (s === 'Pending') return 'bg-amber-50 text-amber-700';
          return 'bg-slate-100 text-slate-700';
        };
        return `
          <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-8">
            <div class="flex items-center justify-between mb-6">
              <div>
                <h1 class="text-xl font-bold text-slate-900">Clients & Invoices</h1>
                <p class="text-sm text-slate-500">Manage active quotes, due dates, and e-invoice signatures.</p>
              </div>
              <a href="#/detail/1" class="px-4 py-2 rounded-lg bg-emerald-700 text-white text-sm font-semibold">Open INV-2026-041</a>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200 shadow-sm">
              ${appState.invoices.map(inv => `
                <div class="p-4 sm:px-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2.5">
                      <a href="#/detail/1" class="font-mono text-sm font-semibold text-slate-900 hover:text-emerald-600">${inv.number}</a>
                      <span class="px-2 py-0.5 rounded-full text-xs font-medium ${badge(inv.status)}">${inv.status}</span>
                    </div>
                    <p class="text-xs text-slate-500 mt-0.5">${inv.client} • ${inv.due}</p>
                  </div>
                  <div class="flex items-center gap-4">
                    <span class="font-mono text-sm font-bold text-slate-900">$${inv.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                    <a href="#/detail/1" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 hover:bg-slate-50">View</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </main>
        `;
      }

      function renderDetail(state) {
        const locked = state === 'locked';
        const subtotal = calcSubtotal();
        const tax = subtotal * appState.taxRate;
        const total = subtotal + tax;
        const isSigning = appState.signing.running || state === 'long-loading';
        const prog = appState.signing.running ? appState.signing.progress : (state === 'long-loading' ? 60 : 0);
        const step = appState.signing.running ? appState.signing.step : (state === 'long-loading' ? 'Step 2/3: Applying qualified e-invoice XAdES signature...' : appState.signing.step);

        return `
          <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="text-xs text-slate-500 font-mono">INV-2026-041</div>
                <h1 class="text-lg font-bold text-slate-900">Northstar Logistics GmbH</h1>
              </div>
              <div class="flex items-center gap-4">
                <div class="text-right">
                  <div class="text-xs text-slate-500">Grand Total (incl. 18% VAT)</div>
                  <div class="font-mono text-2xl font-bold text-slate-900 ${appState.totalUpdated ? 'total-pop' : ''}">$${total.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                </div>
                <button data-motion-trigger onclick="window.__billAddItem()" ${locked ? 'disabled' : ''} class="px-4 py-2.5 rounded-lg bg-emerald-700 hover:bg-emerald-700 text-white text-sm font-semibold disabled:opacity-50">
                  + Add Line Item
                </button>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-5 py-3 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">Line Items</div>
              <div class="divide-y divide-slate-200">
                ${appState.lineItems.map(item => `
                  <div class="px-5 py-3.5 flex items-center justify-between gap-4 text-sm">
                    <div>
                      <div class="font-medium text-slate-900">${item.desc}</div>
                      <div class="text-xs text-slate-500 font-mono">${item.qty} × $${item.rate.toFixed(2)}</div>
                    </div>
                    <div class="font-mono font-semibold text-slate-900">$${(item.qty * item.rate).toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 class="text-sm font-semibold text-slate-900">PDF Generation & E-Invoice Signing (>3s)</h2>
                  <p class="text-xs text-slate-500">Generates PDF/A-3b with embedded XML and qualified signature.</p>
                </div>
                <div class="flex items-center gap-2">
                  ${isSigning ? `
                    <button onclick="window.__billCancelSign()" class="px-3 py-1.5 rounded-lg border border-rose-300 text-rose-700 text-xs font-semibold">Cancel</button>
                  ` : `
                    <button onclick="window.__billStartSign()" ${locked ? 'disabled' : ''} class="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold disabled:opacity-50">Generate & Sign PDF</button>
                  `}
                </div>
              </div>
              ${(isSigning || appState.signing.progress > 0) ? `
                <div class="mt-4 pt-4 border-t border-slate-100">
                  <div class="flex justify-between text-xs mb-1.5">
                    <span class="font-medium text-slate-700">${step}</span>
                    <span class="font-mono text-slate-500">${prog}%</span>
                  </div>
                  <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-700 transition-all duration-300" style="width: ${prog}%"></div>
                  </div>
                </div>
              ` : ''}
            </section>
          </main>
        `;
      }

      function renderSettings(state) {
        const locked = state === 'locked';
        return `
          <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 py-8">
            <h1 class="text-xl font-bold text-slate-900 mb-6">Tax & Company Settings</h1>
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm divide-y divide-slate-200">
              <div class="p-5 flex items-center justify-between">
                <div>
                  <div class="text-sm font-semibold text-slate-900">Legal Entity Name</div>
                  <div class="text-xs text-slate-500">Appears on all signed PDF/A-3b invoices.</div>
                </div>
                <input aria-label="Legal Entity Name" type="text" value="BillCraft Studio LLC" ${locked ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm" />
              </div>
              <div class="p-5 flex items-center justify-between">
                <div>
                  <div class="text-sm font-semibold text-slate-900">Default VAT / Tax Rate (%)</div>
                  <div class="text-xs text-slate-500">Applied automatically to new line items.</div>
                </div>
                <input aria-label="Default VAT Rate" type="number" value="18" ${locked ? 'disabled' : ''} class="w-20 px-3 py-1.5 rounded-lg border border-slate-300 text-sm font-mono text-right" />
              </div>
            </div>
          </main>
        `;
      }

      function render() {
        const route = getEffectiveRoute();
        const state = getEffectiveState();
        let body = '';
        if (route === '#/login') body = renderLogin(state);
        else if (route === '#/list') body = renderList(state);
        else if (route === '#/detail/1') body = renderDetail(state);
        else if (route === '#/settings') body = renderSettings(state);

        document.getElementById('app').innerHTML = `
          ${renderHeader(route)}
          ${renderStateBanner(state)}
          ${body}
        `;
      }

      window.__billAddItem = addLineItemAndRecalculate;
      window.__billStartSign = startSigning;
      window.__billCancelSign = cancelSigning;
      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      render();
    })();
  </script>
</body>
</html>
