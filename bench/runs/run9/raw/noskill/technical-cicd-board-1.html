<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PipeForge — CI/CD Pipeline Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .motion-triggered { animation: pulse-ring 0.7s ease-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    (function () {
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];
      const VALID_ROUTES = ['#/login', '#/list', '#/detail/1', '#/settings'];

      let longOpTimer = null;
      let longOpCancelled = false;
      let longOpRunning = false;
      let longOpStep = 0;

      function getState() {
        if (window.__RENDER_STATE__ && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const params = new URLSearchParams(window.location.search);
        const s = params.get('state');
        return VALID_STATES.includes(s) ? s : 'default';
      }

      function getRoute() {
        const h = window.location.hash;
        if (VALID_ROUTES.includes(h)) return h;
        return '#/login';
      }

      function navigate(route) {
        if (window.location.hash !== route) {
          window.location.hash = route;
        } else {
          render();
        }
      }

      function renderNav(activeRoute) {
        if (activeRoute === '#/login') return '';
        const links = [
          { href: '#/list', label: 'Pipelines' },
          { href: '#/detail/1', label: 'Run #4821' },
          { href: '#/settings', label: 'Settings' },
        ];
        return `
          <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
              <div class="flex items-center gap-6">
                <a href="#/list" class="flex items-center gap-2.5 text-slate-100 font-semibold tracking-tight">
                  <span class="w-7 h-7 rounded-md bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round"/>
                      <circle cx="18" cy="12" r="2.5" fill="currentColor"/>
                    </svg>
                  </span>
                  <span>PipeForge</span>
                  <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">v2.4</span>
                </a>
                <nav class="flex items-center gap-1">
                  ${links.map(l => `
                    <a href="${l.href}" class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${activeRoute === l.href ? 'bg-slate-800 text-emerald-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}">
                      ${l.label}
                    </a>
                  `).join('')}
                </nav>
              </div>
              <div class="flex items-center gap-3">
                <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-mono text-slate-400 bg-slate-800/70 px-2.5 py-1 rounded-full border border-slate-700/70">
                  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                  us-east-1-pool (6/8)
                </span>
                <a href="#/login" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded border border-slate-800 hover:border-slate-700">Sign out</a>
              </div>
            </div>
          </header>
        `;
      }

      function renderStateBanner(state) {
        if (state === 'default') return '';
        const map = {
          'empty': { color: 'border-slate-700 bg-slate-900 text-slate-300', msg: 'Empty state: No items available in this view.' },
          'loading': { color: 'border-sky-500/30 bg-sky-950/40 text-sky-300', msg: 'Loading state: Fetching latest telemetry...' },
          'long-loading': { color: 'border-amber-500/30 bg-amber-950/40 text-amber-300', msg: 'Long-running sync: Waiting on remote runner cluster (>3s)...' },
          'error': { color: 'border-rose-500/40 bg-rose-950/40 text-rose-300', msg: 'Error state: Failed to reach runner coordinator (HTTP 503).' },
          'partial': { color: 'border-amber-500/40 bg-amber-950/30 text-amber-200', msg: 'Partial data: 2 of 5 runner nodes reporting stale heartbeats.' },
          'locked': { color: 'border-violet-500/40 bg-violet-950/40 text-violet-200', msg: 'Locked: Read-only audit mode. Elevated token required to mutate.' }
        };
        const info = map[state];
        return `
          <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4">
            <div class="px-3.5 py-2 rounded-lg border text-xs font-mono flex items-center justify-between ${info.color}">
              <span>[${state.toUpperCase()}] ${info.msg}</span>
            </div>
          </div>
        `;
      }

      function renderLogin(state) {
        const isLocked = state === 'locked';
        const isLoading = state === 'loading' || state === 'long-loading';
        const isError = state === 'error';
        return `
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-7 shadow-2xl">
              <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-lg bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round"/>
                    <circle cx="18" cy="12" r="2.5" fill="currentColor"/>
                  </svg>
                </div>
                <div>
                  <h1 class="text-lg font-semibold text-slate-100">PipeForge Console</h1>
                  <p class="text-xs text-slate-400">Authenticate with Personal Access Token or SSO</p>
                </div>
              </div>

              ${isError ? `<div class="mb-4 p-3 rounded-lg bg-rose-950/50 border border-rose-500/40 text-xs text-rose-300 font-mono">ERR_AUTH_TIMEOUT: SSO identity provider unreachable.</div>` : ''}
              ${isLocked ? `<div class="mb-4 p-3 rounded-lg bg-violet-950/50 border border-violet-500/40 text-xs text-violet-200 font-mono">Organization SSO policy enforces hardware key verification.</div>` : ''}

              <form onsubmit="event.preventDefault(); window.location.hash='#/list';" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1.5">Workspace Slug</label>
                  <input type="text" value="acme-core-infra" ${isLocked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm font-mono text-slate-200 focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1.5">API Token</label>
                  <input type="password" value="pf_live_98a7bc12d4e5" ${isLocked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm font-mono text-slate-200 focus:outline-none focus:border-emerald-500" />
                </div>
                <button type="submit" ${isLocked || isLoading ? 'disabled' : ''} class="w-full py-2.5 px-4 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-sm font-medium transition-colors flex items-center justify-center gap-2">
                  ${isLoading ? '<span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Verifying...' : 'Sign in to Console'}
                </button>
              </form>

              <div class="mt-5 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <span>SSO: Okta / GitHub</span>
                <a href="#/list" class="text-emerald-400 hover:underline">Continue as Guest →</a>
              </div>
            </div>
          </div>
        `;
      }

      function renderList(state) {
        if (state === 'loading' || state === 'long-loading') {
          return `
            <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 space-y-3">
              <div class="h-8 w-48 bg-slate-800 rounded animate-pulse"></div>
              ${[1, 2, 3, 4].map(() => `<div class="h-16 bg-slate-900 border border-slate-800 rounded-lg animate-pulse"></div>`).join('')}
            </main>
          `;
        }
        if (state === 'empty') {
          return `
            <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-16 text-center">
              <div class="inline-flex w-12 h-12 rounded-full bg-slate-900 border border-slate-800 items-center justify-center text-slate-500 mb-3">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18M3 12h18M3 17h18" stroke-linecap="round"/></svg>
              </div>
              <h2 class="text-base font-semibold text-slate-200">No pipeline runs found</h2>
              <p class="text-sm text-slate-400 mt-1">Push a commit or trigger a manual dispatch to start a run.</p>
            </main>
          `;
        }
        const runs = [
          { id: 1, num: '#4821', branch: 'main', commit: 'a94f1c2', msg: 'feat(router): zero-copy stream proxy', status: 'passed', duration: '2m 14s', time: '4m ago' },
          { id: 2, num: '#4820', branch: 'fix/tls-handshake', commit: '7b3e09d', msg: 'fix(tls): rotate ephemeral session keys', status: 'running', duration: '1m 08s', time: '12m ago' },
          { id: 3, num: '#4819', branch: 'main', commit: '5c11a8e', msg: 'chore(deps): bump rustls to 0.23.4', status: 'failed', duration: '0m 49s', time: '38m ago' },
          { id: 4, num: '#4818', branch: 'release/v2.4', commit: '1d88f02', msg: 'release: tag v2.4.0-rc2 artifacts', status: 'passed', duration: '3m 41s', time: '2h ago' }
        ];
        const visibleRuns = state === 'partial' ? runs.slice(0, 2) : runs;
        const badge = (s) => {
          if (s === 'passed') return 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
          if (s === 'running') return 'bg-sky-500/15 text-sky-400 border-sky-500/30';
          return 'bg-rose-500/15 text-rose-400 border-rose-500/30';
        };
        return `
          <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-6">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-5">
              <div>
                <h1 class="text-xl font-semibold text-slate-100">Pipeline Runs</h1>
                <p class="text-xs text-slate-400 mt-0.5">Recent workflow executions across connected repositories</p>
              </div>
              <a href="#/detail/1" class="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-medium text-white transition-colors">Inspect Run #4821 →</a>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-800">
              ${visibleRuns.map(r => `
                <a href="#/detail/1" class="flex flex-wrap items-center justify-between gap-4 px-4 py-3.5 hover:bg-slate-800/50 transition-colors">
                  <div class="flex items-center gap-3 min-w-0">
                    <span class="px-2 py-0.5 rounded text-[11px] font-mono border ${badge(r.status)}">${r.status}</span>
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-sm font-semibold text-slate-100">${r.num}</span>
                        <span class="text-sm text-slate-200 truncate">${r.msg}</span>
                      </div>
                      <div class="flex items-center gap-3 text-xs font-mono text-slate-400 mt-0.5">
                        <span>branch: ${r.branch}</span>
                        <span>commit: ${r.commit}</span>
                      </div>
                    </div>
                  </div>
                  <div class="flex items-center gap-5 text-xs font-mono text-slate-400">
                    <span>${r.duration}</span>
                    <span>${r.time}</span>
                  </div>
                </a>
              `).join('')}
            </div>
          </main>
        `;
      }

      function renderDetail(state) {
        const isLocked = state === 'locked';
        const steps = [
          'Checkout repository & submodules',
          'Restore cargo & node build cache',
          'Run unit & integration test suite',
          'Package OCI container & sign SBOM'
        ];
        return `
          <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2.5">
                  <a href="#/list" class="text-xs font-mono text-slate-400 hover:text-slate-200">← Pipelines</a>
                  <span class="text-slate-700">/</span>
                  <span class="text-xs font-mono text-emerald-400">Run #4821</span>
                </div>
                <h1 class="text-xl font-semibold text-slate-100 mt-1">feat(router): zero-copy stream proxy</h1>
                <p class="text-xs font-mono text-slate-400 mt-0.5">branch: main · commit: a94f1c2 · runner: us-east-1-04</p>
              </div>
              <div class="flex items-center gap-2.5">
                <button id="motionBtn" data-motion-trigger ${isLocked ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-50 border border-slate-700 text-xs font-medium text-slate-100 transition-all">
                  Re-run Job (Quick)
                </button>
                <button id="longOpBtn" ${isLocked ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-medium text-white transition-colors">
                  Full Re-run &amp; Artifact Build
                </button>
              </div>
            </div>

            <div id="motionFeedback" class="hidden px-3.5 py-2 rounded-lg bg-emerald-950/60 border border-emerald-500/40 text-xs font-mono text-emerald-300">
              ✓ Job #4821-a queued on us-east-1-04 (latency: 18ms)
            </div>

            <div id="longOpPanel" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <span id="longOpTitle" class="text-sm font-medium text-slate-100">Running full pipeline &amp; artifact build...</span>
                <button id="cancelLongOpBtn" class="px-2.5 py-1 rounded bg-rose-950/60 hover:bg-rose-900/60 border border-rose-500/40 text-xs font-mono text-rose-300">Cancel</button>
              </div>
              <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div id="longOpBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
              </div>
              <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono">
                ${steps.map((s, idx) => `
                  <li id="step-${idx}" class="px-2.5 py-1.5 rounded bg-slate-950 border border-slate-800 text-slate-400">
                    [pending] ${s}
                  </li>
                `).join('')}
              </ul>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
              <div class="px-4 py-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs font-mono text-slate-400">
                <span>Live Terminal Tail — job/build-and-sign</span>
                <span class="text-emerald-400">exit code 0</span>
              </div>
              <pre class="p-4 text-xs font-mono text-slate-300 leading-relaxed overflow-x-auto">20:14:02.114 [info]  Restored 412MB build cache in 1.2s
20:14:03.489 [build] Compiling pipeforge-core v2.4.0 (/workspace/core)
20:14:11.002 [test]  running 48 tests ... 48 passed; 0 failed
20:14:14.770 [oci]   Built image ghcr.io/acme/pipeforge:a94f1c2 (84.2 MB)
20:14:15.109 [done]  Pipeline #4821 completed successfully.</pre>
            </div>
          </main>
        `;
      }

      function renderSettings(state) {
        const isLocked = state === 'locked';
        return `
          <main class="max-w-4xl mx-auto w-full px-4 sm:px-6 py-6 space-y-6">
            <div>
              <h1 class="text-xl font-semibold text-slate-100">Runner Pool &amp; Webhooks</h1>
              <p class="text-xs text-slate-400 mt-0.5">Configure self-hosted runner concurrency and outbound event hooks</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1.5">Max Concurrent Runners</label>
                  <input type="number" value="8" ${isLocked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm font-mono text-slate-200" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1.5">Default Timeout (minutes)</label>
                  <input type="number" value="30" ${isLocked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm font-mono text-slate-200" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Webhook Endpoint</label>
                <input type="url" value="https://hooks.acme.internal/pipeforge" ${isLocked ? 'disabled' : ''} class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm font-mono text-slate-200" />
              </div>
              <div class="pt-2 flex justify-end">
                <button ${isLocked ? 'disabled' : ''} class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-medium text-white">Save Configuration</button>
              </div>
            </div>
          </main>
        `;
      }

      function bindDetailHandlers() {
        const motionBtn = document.getElementById('motionBtn');
        const motionFeedback = document.getElementById('motionFeedback');
        if (motionBtn && motionFeedback) {
          motionBtn.addEventListener('click', () => {
            motionBtn.classList.remove('motion-triggered');
            void motionBtn.offsetWidth;
            motionBtn.classList.add('motion-triggered');
            motionFeedback.classList.remove('hidden');
          });
        }

        const longOpBtn = document.getElementById('longOpBtn');
        const longOpPanel = document.getElementById('longOpPanel');
        const longOpBar = document.getElementById('longOpBar');
        const longOpTitle = document.getElementById('longOpTitle');
        const cancelBtn = document.getElementById('cancelLongOpBtn');

        if (longOpBtn && longOpPanel) {
          longOpBtn.addEventListener('click', () => {
            if (longOpRunning) return;
            longOpRunning = true;
            longOpCancelled = false;
            longOpStep = 0;
            longOpPanel.classList.remove('hidden');
            longOpTitle.textContent = 'Running full pipeline & artifact build...';
            longOpBar.style.width = '10%';

            const runStep = () => {
              if (longOpCancelled) return;
              if (longOpStep < 4) {
                const el = document.getElementById(`step-${longOpStep}`);
                if (el) {
                  el.className = 'px-2.5 py-1.5 rounded bg-emerald-950/50 border border-emerald-500/40 text-emerald-300';
                  el.textContent = el.textContent.replace('[pending]', '[done]');
                }
                longOpStep++;
                longOpBar.style.width = `${longOpStep * 25}%`;
                longOpTimer = setTimeout(runStep, 900);
              } else {
                longOpRunning = false;
                longOpTitle.textContent = '✓ Full pipeline & artifact build complete (3.6s)';
              }
            };
            longOpTimer = setTimeout(runStep, 900);
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            longOpCancelled = true;
            longOpRunning = false;
            clearTimeout(longOpTimer);
            if (longOpTitle) longOpTitle.textContent = 'Operation cancelled by user.';
          });
        }
      }

      function render() {
        const route = getRoute();
        const state = getState();
        const app = document.getElementById('app');

        let body = '';
        if (route === '#/login') body = renderLogin(state);
        else if (route === '#/list') body = renderList(state);
        else if (route === '#/detail/1') body = renderDetail(state);
        else if (route === '#/settings') body = renderSettings(state);

        app.innerHTML = renderNav(route) + renderStateBanner(state) + body;
        if (route === '#/detail/1') bindDetailHandlers();
      }

      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      if (document.readyState !== 'loading') render();
    })();
  </script>
</body>
</html>
