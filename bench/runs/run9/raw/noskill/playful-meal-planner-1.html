<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZestWeek — Weekly Meal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    h1, h2, .font-display { font-family: 'Fredoka', system-ui, sans-serif; }
    @keyframes pop-bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .pop-active { animation: pop-bounce 0.35s ease-out; }
  </style>
</head>
<body class="bg-amber-50/60 text-stone-800 min-h-screen antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    (function () {
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];
      const VALID_ROUTES = ['#/login', '#/list', '#/detail/1', '#/settings'];

      let servings = 2;
      let longOpTimer = null;
      let longOpRunning = false;
      let longOpCancelled = false;

      function getState() {
        if (window.__RENDER_STATE__ && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const params = new URLSearchParams(window.location.search);
        const s = params.get('state');
        return VALID_STATES.includes(s) ? s : 'default';
      }

      function getRoute() {
        const h = window.location.hash;
        if (VALID_ROUTES.includes(h)) return h;
        return '#/login';
      }

      function renderNav(activeRoute) {
        if (activeRoute === '#/login') return '';
        const links = [
          { href: '#/list', label: 'Weekly Plan' },
          { href: '#/detail/1', label: 'Lemon Herb Bowl' },
          { href: '#/settings', label: 'Pantry & Diet' },
        ];
        return `
          <header class="bg-white/90 backdrop-blur border-b border-amber-200/80 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <div class="flex items-center gap-6">
                <a href="#/list" class="flex items-center gap-2.5 text-stone-900 font-display text-xl font-semibold">
                  <span class="w-9 h-9 rounded-2xl bg-orange-500 text-white flex items-center justify-center shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <path d="M12 3c4 0 7 3 7 7 0 5-7 11-7 11S5 15 5 10c0-4 3-7 7-7z"/>
                      <circle cx="12" cy="10" r="2.2" fill="currentColor"/>
                    </svg>
                  </span>
                  <span>ZestWeek</span>
                </a>
                <nav class="flex items-center gap-1.5">
                  ${links.map(l => `
                    <a href="${l.href}" class="px-3.5 py-1.5 rounded-full text-sm font-semibold transition-colors ${activeRoute === l.href ? 'bg-orange-100 text-orange-700' : 'text-stone-600 hover:bg-amber-100/60'}">
                      ${l.label}
                    </a>
                  `).join('')}
                </nav>
              </div>
              <a href="#/login" class="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-1.5 rounded-full border border-stone-200 bg-white">Switch Kitchen</a>
            </div>
          </header>
        `;
      }

      function renderStateBanner(state) {
        if (state === 'default') return '';
        const styles = {
          'empty': 'bg-stone-100 border-stone-300 text-stone-700',
          'loading': 'bg-sky-50 border-sky-200 text-sky-800',
          'long-loading': 'bg-amber-100 border-amber-300 text-amber-900',
          'error': 'bg-rose-50 border-rose-200 text-rose-800',
          'partial': 'bg-orange-50 border-orange-200 text-orange-800',
          'locked': 'bg-purple-50 border-purple-200 text-purple-800'
        };
        return `
          <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-4">
            <div class="px-4 py-2 rounded-2xl border text-xs font-semibold ${styles[state]}">
              State: ${state}
            </div>
          </div>
        `;
      }

      function renderLogin(state) {
        const isLocked = state === 'locked';
        const isLoading = state === 'loading' || state === 'long-loading';
        const isError = state === 'error';
        return `
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-md bg-white border-2 border-amber-200 rounded-3xl p-8 shadow-xl shadow-orange-900/5">
              <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-500 text-white flex items-center justify-center mb-3 shadow-md shadow-orange-500/20">
                  <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 3c4 0 7 3 7 7 0 5-7 11-7 11S5 15 5 10c0-4 3-7 7-7z"/>
                    <circle cx="12" cy="10" r="2.2" fill="currentColor"/>
                  </svg>
                </div>
                <h1 class="text-2xl font-display font-bold text-stone-900">Welcome to ZestWeek</h1>
                <p class="text-sm text-stone-500 mt-1">Plan joyful weeknight dinners in minutes</p>
              </div>

              ${isError ? `<div class="mb-4 p-3 rounded-2xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700">Oops! Could not sync your family meal board.</div>` : ''}
              ${isLocked ? `<div class="mb-4 p-3 rounded-2xl bg-purple-50 border border-purple-200 text-xs font-semibold text-purple-700">Kitchen is in view-only mode for guests.</div>` : ''}

              <form onsubmit="event.preventDefault(); window.location.hash='#/list';" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-stone-600 mb-1">Email</label>
                  <input type="email" value="maya@zestweek.app" ${isLocked ? 'disabled' : ''} class="w-full px-4 py-2.5 rounded-2xl bg-amber-50/50 border border-amber-200 text-sm focus:outline-none focus:border-orange-400" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-stone-600 mb-1">Password</label>
                  <input type="password" value="••••••••••" ${isLocked ? 'disabled' : ''} class="w-full px-4 py-2.5 rounded-2xl bg-amber-50/50 border border-amber-200 text-sm focus:outline-none focus:border-orange-400" />
                </div>
                <button type="submit" ${isLocked || isLoading ? 'disabled' : ''} class="w-full py-3 rounded-2xl bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-bold text-sm shadow-md shadow-orange-500/20 transition-all">
                  ${isLoading ? 'Warming up the kitchen...' : 'Open My Meal Plan'}
                </button>
              </form>
            </div>
          </div>
        `;
      }

      function renderList(state) {
        if (state === 'loading' || state === 'long-loading') {
          return `
            <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${[1, 2, 3, 4].map(() => `<div class="h-32 rounded-3xl bg-white border border-amber-200 animate-pulse"></div>`).join('')}
            </main>
          `;
        }
        if (state === 'empty') {
          return `
            <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-16 text-center">
              <h2 class="text-xl font-display font-bold text-stone-800">Your week is wide open!</h2>
              <p class="text-sm text-stone-500 mt-1">Add your first recipe to start building this week's menu.</p>
            </main>
          `;
        }
        const days = [
          { day: 'Monday', title: 'Lemon Herb Quinoa Bowl', prep: '20 min', tag: 'Fresh & Light', color: 'bg-lime-100 text-lime-800' },
          { day: 'Tuesday', title: 'Crispy Chili Tofu Tacos', prep: '25 min', tag: '15g Protein', color: 'bg-orange-100 text-orange-800' },
          { day: 'Wednesday', title: 'Roasted Tomato Basil Soup', prep: '30 min', tag: 'Cozy', color: 'bg-rose-100 text-rose-800' },
          { day: 'Thursday', title: 'Garlic Butter Salmon & Greens', prep: '22 min', tag: 'Omega-3', color: 'bg-sky-100 text-sky-800' }
        ];
        const items = state === 'partial' ? days.slice(0, 2) : days;
        return `
          <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 class="text-2xl font-display font-bold text-stone-900">This Week's Menu</h1>
                <p class="text-sm text-stone-500">Tap any day to adjust servings or generate your grocery list</p>
              </div>
              <a href="#/detail/1" class="px-4 py-2 rounded-full bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold shadow-sm">View Monday's Recipe →</a>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${items.map(d => `
                <a href="#/detail/1" class="group bg-white border-2 border-amber-200/80 hover:border-orange-400 rounded-3xl p-5 transition-all shadow-sm">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-orange-600">${d.day}</span>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${d.color}">${d.tag}</span>
                  </div>
                  <h3 class="text-lg font-display font-semibold text-stone-900 group-hover:text-orange-600 transition-colors">${d.title}</h3>
                  <p class="text-xs text-stone-500 mt-2 font-medium">Prep &amp; Cook: ${d.prep}</p>
                </a>
              `).join('')}
            </div>
          </main>
        `;
      }

      function renderDetail(state) {
        const isLocked = state === 'locked';
        const baseIngredients = [
          { name: 'Tri-color quinoa', amount: 0.75, unit: 'cup' },
          { name: 'Cherry tomatoes', amount: 1, unit: 'cup' },
          { name: 'Fresh lemon juice', amount: 1.5, unit: 'tbsp' },
          { name: 'Extra-virgin olive oil', amount: 1, unit: 'tbsp' }
        ];
        return `
          <main class="max-w-4xl mx-auto w-full px-4 sm:px-6 py-6 space-y-6">
            <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 shadow-sm">
              <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-orange-600">Monday · 20 min</span>
                  <h1 class="text-2xl font-display font-bold text-stone-900 mt-1">Lemon Herb Quinoa Bowl</h1>
                </div>
                <div class="flex items-center gap-3 bg-amber-50 border border-amber-200 rounded-2xl px-3 py-2">
                  <span class="text-xs font-bold text-stone-600">Servings:</span>
                  <button id="servingMinus" ${isLocked ? 'disabled' : ''} class="w-7 h-7 rounded-full bg-white border border-amber-300 font-bold text-stone-700 hover:bg-orange-100">-</button>
                  <span id="servingCount" class="font-display font-bold text-lg text-orange-600 w-5 text-center">${servings}</span>
                  <button id="servingPlus" data-motion-trigger ${isLocked ? 'disabled' : ''} class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold hover:bg-orange-600">+</button>
                </div>
              </div>

              <div class="mt-6">
                <h2 class="text-sm font-bold uppercase tracking-wider text-stone-500 mb-3">Ingredients</h2>
                <ul id="ingredientList" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${baseIngredients.map(i => `
                    <li class="px-4 py-2.5 rounded-2xl bg-amber-50/70 border border-amber-200/70 flex items-center justify-between text-sm">
                      <span class="font-medium text-stone-800">${i.name}</span>
                      <span class="font-bold text-orange-700">${(i.amount * servings).toFixed(1).replace(/\.0$/, '')} ${i.unit}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>

              <div class="mt-6 pt-5 border-t border-amber-100 flex flex-wrap items-center justify-between gap-3">
                <span class="text-xs text-stone-500">Syncs with your pantry inventory automatically</span>
                <button id="groceryBtn" ${isLocked ? 'disabled' : ''} class="px-4 py-2.5 rounded-2xl bg-lime-600 hover:bg-lime-700 disabled:opacity-50 text-white text-xs font-bold shadow-sm transition-colors">
                  Generate Smart Grocery List
                </button>
              </div>
            </div>

            <div id="groceryPanel" class="hidden bg-white border-2 border-lime-300 rounded-3xl p-5 space-y-3">
              <div class="flex items-center justify-between">
                <span id="groceryTitle" class="text-sm font-bold text-stone-800">Building your aisle-sorted grocery list...</span>
                <button id="cancelGroceryBtn" class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-bold">Cancel</button>
              </div>
              <div class="w-full h-2.5 bg-lime-100 rounded-full overflow-hidden">
                <div id="groceryBar" class="h-full bg-lime-500 transition-all duration-300" style="width: 0%"></div>
              </div>
              <p id="groceryStatus" class="text-xs text-stone-500 font-medium">Checking pantry staples...</p>
            </div>
          </main>
        `;
      }

      function renderSettings(state) {
        const isLocked = state === 'locked';
        return `
          <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 py-6 space-y-5">
            <h1 class="text-2xl font-display font-bold text-stone-900">Dietary &amp; Pantry Preferences</h1>
            <div class="bg-white border-2 border-amber-200 rounded-3xl p-6 space-y-4">
              <div>
                <label class="block text-xs font-bold text-stone-600 mb-1.5">Dietary Style</label>
                <select ${isLocked ? 'disabled' : ''} class="w-full px-4 py-2.5 rounded-2xl bg-amber-50/50 border border-amber-200 text-sm font-medium">
                  <option>Mediterranean &amp; Plant-Forward</option>
                  <option>High-Protein Balanced</option>
                  <option>Vegetarian</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-stone-600 mb-1.5">Default Household Servings</label>
                <input type="number" value="2" ${isLocked ? 'disabled' : ''} class="w-full px-4 py-2.5 rounded-2xl bg-amber-50/50 border border-amber-200 text-sm font-medium" />
              </div>
              <button ${isLocked ? 'disabled' : ''} class="px-5 py-2.5 rounded-2xl bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white text-xs font-bold">Save Preferences</button>
            </div>
          </main>
        `;
      }

      function bindDetailHandlers() {
        const plus = document.getElementById('servingPlus');
        const minus = document.getElementById('servingMinus');
        if (plus) {
          plus.addEventListener('click', () => {
            servings = Math.min(12, servings + 1);
            render();
            const countEl = document.getElementById('servingCount');
            if (countEl) countEl.classList.add('pop-active');
          });
        }
        if (minus) {
          minus.addEventListener('click', () => {
            servings = Math.max(1, servings - 1);
            render();
          });
        }

        const groceryBtn = document.getElementById('groceryBtn');
        const groceryPanel = document.getElementById('groceryPanel');
        const groceryBar = document.getElementById('groceryBar');
        const groceryTitle = document.getElementById('groceryTitle');
        const groceryStatus = document.getElementById('groceryStatus');
        const cancelBtn = document.getElementById('cancelGroceryBtn');

        if (groceryBtn && groceryPanel) {
          groceryBtn.addEventListener('click', () => {
            if (longOpRunning) return;
            longOpRunning = true;
            longOpCancelled = false;
            groceryPanel.classList.remove('hidden');
            const stages = [
              { pct: 25, msg: 'Checking pantry staples...' },
              { pct: 55, msg: 'Scaling quantities for ' + servings + ' servings...' },
              { pct: 85, msg: 'Grouping by Produce, Grains & Dairy...' },
              { pct: 100, msg: '✓ Grocery list ready (4 items added)!' }
            ];
            let i = 0;
            const next = () => {
              if (longOpCancelled) return;
              if (i < stages.length) {
                groceryBar.style.width = stages[i].pct + '%';
                groceryStatus.textContent = stages[i].msg;
                i++;
                if (i < stages.length) longOpTimer = setTimeout(next, 950);
                else {
                  longOpRunning = false;
                  groceryTitle.textContent = 'Grocery List Generated';
                }
              }
            };
            longOpTimer = setTimeout(next, 800);
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            longOpCancelled = true;
            longOpRunning = false;
            clearTimeout(longOpTimer);
            if (groceryStatus) groceryStatus.textContent = 'Cancelled.';
          });
        }
      }

      function render() {
        const route = getRoute();
        const state = getState();
        const app = document.getElementById('app');
        let body = '';
        if (route === '#/login') body = renderLogin(state);
        else if (route === '#/list') body = renderList(state);
        else if (route === '#/detail/1') body = renderDetail(state);
        else if (route === '#/settings') body = renderSettings(state);

        app.innerHTML = renderNav(route) + renderStateBanner(state) + body;
        if (route === '#/detail/1') bindDetailHandlers();
      }

      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      if (document.readyState !== 'loading') render();
    })();
  </script>
</body>
</html>
