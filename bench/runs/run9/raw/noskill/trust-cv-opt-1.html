<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVPulse — AI Resume & ATS Optimization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @keyframes pulseScore {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); color: #059669; }
      100% { transform: scale(1); }
    }
    .score-pop {
      animation: pulseScore 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="app"></div>

  <script>
    (function () {
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];

      const state = {
        route: '#/login',
        renderState: 'default',
        score: 69,
        scoreHistory: [62, 65, 69],
        suggestions: [
          {
            id: 's1',
            section: 'Experience • Senior Product Engineer',
            impact: '+4 pts',
            before: 'Worked on frontend performance and helped team ship features faster.',
            after: 'Reduced Core Web Vitals LCP by 38% across 14M monthly sessions by implementing route-level code splitting and edge caching.',
            status: 'pending'
          },
          {
            id: 's2',
            section: 'Skills • ATS Keyword Alignment',
            impact: '+3 pts',
            before: 'React, JavaScript, CSS, APIs',
            after: 'React 18, TypeScript, Next.js, GraphQL, Design Systems, CI/CD, Playwright',
            status: 'pending'
          },
          {
            id: 's3',
            section: 'Summary • Role Positioning',
            impact: '+2 pts',
            before: 'Experienced developer looking for senior roles.',
            after: 'Staff-track Frontend Engineer with 7+ years scaling B2B SaaS interfaces, accessibility compliance (WCAG 2.1 AA), and design tooling.',
            status: 'accepted'
          }
        ],
        analysis: {
          running: false,
          progress: 0,
          stageIndex: 0,
          elapsed: 0,
          completed: false,
          cancelled: false,
          timerId: null
        },
        resumes: [
          { id: 1, title: 'Staff Frontend Engineer — Stripe', updated: '2h ago', ats: 69, target: 85, status: 'Needs Review' },
          { id: 2, title: 'Senior Product Engineer — Linear', updated: 'Yesterday', ats: 84, target: 85, status: 'Optimized' },
          { id: 3, title: 'Design Systems Lead — Vercel', updated: '3d ago', ats: 76, target: 85, status: 'In Progress' },
          { id: 4, title: 'Fullstack Engineer — Anthropic', updated: '1w ago', ats: 61, target: 80, status: 'Draft' }
        ],
        settings: {
          autoKeywords: true,
          strictAts: true,
          anonymizeExport: false,
          exportFormat: 'PDF (ATS-Safe)'
        }
      };

      const ANALYSIS_STAGES = [
        'Parsing resume structure & section hierarchy…',
        'Extracting 42 role-specific ATS keywords…',
        'Benchmarking quantified impact statements…',
        'Simulating Workday & Greenhouse parser pass…',
        'Generating prioritized rewrite recommendations…'
      ];

      function getRenderState() {
        if (typeof window.__RENDER_STATE__ === 'string' && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const params = new URLSearchParams(window.location.search);
        const q = params.get('state');
        if (q && VALID_STATES.includes(q)) return q;
        return 'default';
      }

      function normalizeRoute(hash) {
        const clean = (hash || '').split('?')[0];
        if (['#/login', '#/list', '#/detail/1', '#/settings'].includes(clean)) {
          return clean;
        }
        return '#/login';
      }

      function navigate(route) {
        if (window.location.hash !== route) {
          window.location.hash = route;
        } else {
          state.route = normalizeRoute(route);
          render();
        }
      }

      function badgeClass(status) {
        switch (status) {
          case 'Optimized': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
          case 'Needs Review': return 'bg-amber-50 text-amber-700 border-amber-200';
          case 'In Progress': return 'bg-indigo-50 text-indigo-700 border-indigo-200';
          default: return 'bg-slate-100 text-slate-600 border-slate-200';
        }
      }

      function renderShell(activeRoute, contentHtml) {
        const navItems = [
          { route: '#/list', label: 'Resumes' },
          { route: '#/detail/1', label: 'CV Detail' },
          { route: '#/settings', label: 'Settings & Export' }
        ];
        return `
          <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
              <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
                <div class="flex items-center gap-6">
                  <a href="#/list" class="flex items-center gap-2 font-semibold text-slate-900 tracking-tight">
                    <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                      </svg>
                    </span>
                    <span>CVPulse</span>
                  </a>
                  <nav class="hidden sm:flex items-center gap-1">
                    ${navItems.map(item => `
                      <a href="${item.route}" class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${activeRoute === item.route ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}">${item.label}</a>
                    `).join('')}
                  </nav>
                </div>
                <div class="flex items-center gap-3">
                  <span class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    State: ${state.renderState}
                  </span>
                  <a href="#/login" class="text-xs font-medium text-slate-500 hover:text-slate-800 px-2.5 py-1.5 rounded-md border border-slate-200 bg-white">Sign out</a>
                </div>
              </div>
            </header>
            <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
              ${contentHtml}
            </main>
          </div>
        `;
      }

      function renderStateBanner() {
        const rs = state.renderState;
        if (rs === 'loading') {
          return `
            <div class="space-y-4">
              <div class="h-8 w-56 rounded-lg skeleton"></div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="h-28 rounded-xl skeleton"></div>
                <div class="h-28 rounded-xl skeleton"></div>
                <div class="h-28 rounded-xl skeleton"></div>
              </div>
              <div class="h-64 rounded-xl skeleton"></div>
            </div>
          `;
        }
        if (rs === 'long-loading') {
          return `
            <div class="bg-white border border-slate-200 rounded-xl p-8 text-center max-w-lg mx-auto my-8 shadow-sm">
              <div class="w-10 h-10 mx-auto mb-4 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin"></div>
              <h2 class="text-base font-semibold text-slate-900">Syncing ATS Benchmark Index</h2>
              <p class="text-sm text-slate-500 mt-1">Fetching latest recruiter keyword weights and parser rules. This may take a few seconds…</p>
              <div class="mt-4 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-indigo-600 h-2 rounded-full w-2/3 animate-pulse"></div>
              </div>
              <p class="text-xs font-mono text-slate-400 mt-3">Elapsed: 04.2s • Queue position #1</p>
            </div>
          `;
        }
        if (rs === 'error') {
          return `
            <div class="bg-rose-50 border border-rose-200 rounded-xl p-6 max-w-xl mx-auto my-6">
              <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center shrink-0 font-bold">!</div>
                <div class="flex-1">
                  <h3 class="text-sm font-semibold text-rose-900">Unable to load CVPulse workspace</h3>
                  <p class="text-sm text-rose-700 mt-1">The ATS scoring service returned HTTP 503 (Service Unavailable). Your local edits are preserved.</p>
                  <button onclick="window.location.search=''" class="mt-3 px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-medium hover:bg-rose-700">Retry Connection</button>
                </div>
              </div>
            </div>
          `;
        }
        if (rs === 'locked') {
          return `
            <div class="bg-white border border-slate-200 rounded-xl p-8 max-w-lg mx-auto my-8 text-center shadow-sm">
              <div class="w-11 h-11 mx-auto mb-3 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <h2 class="text-base font-semibold text-slate-900">Workspace Locked — Pro Plan Required</h2>
              <p class="text-sm text-slate-500 mt-1">You have reached the 3-resume limit on the Starter tier. Upgrade to unlock unlimited ATS simulations and AI rewrites.</p>
              <button onclick="window.location.hash='#/settings'" class="mt-4 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">Manage Plan</button>
            </div>
          `;
        }
        return null;
      }

      function renderLogin() {
        const special = renderStateBanner();
        if (special) return renderShell('#/login', special);
        return `
          <div class="min-h-screen flex items-center justify-center px-4 py-12 bg-slate-50">
            <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
              <div class="flex items-center gap-2.5 mb-6">
                <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  </svg>
                </span>
                <div>
                  <h1 class="text-lg font-semibold text-slate-900 leading-tight">CVPulse</h1>
                  <p class="text-xs text-slate-500">AI Resume & ATS Optimization</p>
                </div>
              </div>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Work or Personal Email</label>
                  <input type="email" value="alex.morgan@example.com" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                  <input type="password" value="••••••••••••" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">Sign in to Workspace</button>
              </form>
              <div class="mt-4 pt-4 border-t border-slate-100">
                <button id="demo-signin" type="button" class="w-full py-2 rounded-lg border border-slate-300 bg-slate-50 text-slate-700 text-sm font-medium hover:bg-slate-100 transition-colors">
                  Demo Sign-In (Alex Morgan)
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderList() {
        const special = renderStateBanner();
        if (special) return renderShell('#/list', special);

        if (state.renderState === 'empty') {
          return renderShell('#/list', `
            <div class="bg-white border border-dashed border-slate-300 rounded-xl p-12 text-center max-w-lg mx-auto my-8">
              <h2 class="text-base font-semibold text-slate-900">No resumes uploaded yet</h2>
              <p class="text-sm text-slate-500 mt-1">Upload a PDF or DOCX resume to run your first ATS compatibility scan.</p>
              <button onclick="window.location.hash='#/detail/1'" class="mt-4 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">Create Sample Resume</button>
            </div>
          `);
        }

        const list = state.renderState === 'partial' ? state.resumes.slice(0, 2) : state.resumes;
        return renderShell('#/list', `
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-xl font-semibold text-slate-900">Resume Workspace</h1>
              <p class="text-sm text-slate-500">Track ATS scores, keyword coverage, and tailored versions.</p>
            </div>
            <a href="#/detail/1" class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
              Open Primary CV (#1)
            </a>
          </div>

          ${state.renderState === 'partial' ? `
            <div class="mb-4 px-4 py-2.5 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-800">
              Partial sync: Showing 2 of 4 resumes while archive storage reconnects.
            </div>
          ` : ''}

          <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <div class="divide-y divide-slate-200">
              ${list.map(r => `
                <div class="p-4 sm:px-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-slate-50 transition-colors">
                  <div>
                    <div class="flex items-center gap-2.5">
                      <a href="#/detail/1" class="text-sm font-semibold text-slate-900 hover:text-indigo-600">${r.title}</a>
                      <span class="px-2 py-0.5 text-xs font-medium rounded-full border ${badgeClass(r.status)}">${r.status}</span>
                    </div>
                    <p class="text-xs text-slate-500 mt-1">Updated ${r.updated} • Target ATS ${r.target}+</p>
                  </div>
                  <div class="flex items-center gap-4">
                    <div class="text-right">
                      <div class="text-xs text-slate-500">ATS Score</div>
                      <div class="text-base font-mono font-semibold text-slate-900">${r.id === 1 ? state.score : r.ats}/100</div>
                    </div>
                    <a href="#/detail/1" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-700 hover:bg-slate-100">Optimize</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `);
      }

      function renderDetail() {
        const special = renderStateBanner();
        if (special) return renderShell('#/detail/1', special);

        if (state.renderState === 'empty') {
          return renderShell('#/detail/1', `
            <div class="bg-white border border-dashed border-slate-300 rounded-xl p-10 text-center max-w-lg mx-auto my-8">
              <h2 class="text-base font-semibold text-slate-900">No AI suggestions available</h2>
              <p class="text-sm text-slate-500 mt-1">Run a deep AI CV analysis to generate ATS keyword and impact rewrites.</p>
            </div>
          `);
        }

        const suggestions = state.renderState === 'partial' ? state.suggestions.slice(0, 1) : state.suggestions;
        const a = state.analysis;

        return renderShell('#/detail/1', `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
                <a href="#/list" class="hover:text-slate-800">Resumes</a>
                <span>/</span>
                <span>Detail #1</span>
              </div>
              <h1 class="text-xl font-semibold text-slate-900">Staff Frontend Engineer — Stripe</h1>
            </div>
            <div class="flex items-center gap-2.5">
              <button data-motion-trigger id="boost-score-btn" type="button" class="px-3.5 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition-colors">
                Apply Top Rewrite (69 → 73)
              </button>
              <button id="run-analysis-btn" type="button" ${a.running ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:opacity-50 transition-colors">
                ${a.running ? 'Analyzing…' : 'Run 30s AI CV Analysis'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="space-y-4">
              <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">Current ATS Score</div>
                <div class="mt-2 flex items-baseline gap-2">
                  <span id="ats-score-value" class="text-4xl font-mono font-bold text-slate-900">${state.score}</span>
                  <span class="text-sm text-slate-400 font-mono">/ 100</span>
                </div>
                <div class="mt-3 text-xs text-slate-600">
                  Score History: <span class="font-mono font-medium text-slate-800">${state.scoreHistory.join(' → ')}</span>
                </div>
              </div>

              <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <h2 class="text-sm font-semibold text-slate-900">Deep AI Analysis</h2>
                  <span class="text-xs font-mono text-slate-500">${a.elapsed.toFixed(1)}s</span>
                </div>
                <p class="text-xs text-slate-500 mb-3">
                  ${a.running ? ANALYSIS_STAGES[a.stageIndex] : a.completed ? 'Analysis complete: 3 high-impact gaps identified.' : a.cancelled ? 'Analysis cancelled by user.' : 'Runs a >3s multi-stage ATS & semantic benchmark.'}
                </p>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden mb-3">
                  <div class="bg-indigo-600 h-2 transition-all duration-300" style="width: ${a.progress}%"></div>
                </div>
                <div class="flex items-center justify-between text-xs">
                  <span class="text-slate-500 font-mono">${a.progress}%</span>
                  ${a.running ? `<button id="cancel-analysis-btn" type="button" class="text-rose-600 font-medium hover:underline">Cancel</button>` : ''}
                </div>
              </div>
            </div>

            <div class="lg:col-span-2 space-y-4">
              ${suggestions.map(s => `
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <div class="text-xs font-semibold text-slate-700">${s.section}</div>
                    <span class="px-2 py-0.5 rounded-full text-xs font-mono font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">${s.impact}</span>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div class="p-3 rounded-lg bg-rose-50/60 border border-rose-100 text-slate-700">
                      <div class="font-semibold text-rose-700 mb-1">Original</div>
                      ${s.before}
                    </div>
                    <div class="p-3 rounded-lg bg-emerald-50/60 border border-emerald-100 text-slate-700">
                      <div class="font-semibold text-emerald-700 mb-1">AI Suggestion</div>
                      ${s.after}
                    </div>
                  </div>
                  <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-slate-500">Status: <strong class="text-slate-800 capitalize">${s.status}</strong></span>
                    <div class="flex items-center gap-2">
                      <button data-reject="${s.id}" type="button" class="px-3 py-1 rounded-md border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-100">Reject</button>
                      <button data-accept="${s.id}" type="button" class="px-3 py-1 rounded-md bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700">Accept</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `);
      }

      function renderSettings() {
        const special = renderStateBanner();
        if (special) return renderShell('#/settings', special);
        return renderShell('#/settings', `
          <div class="max-w-2xl">
            <h1 class="text-xl font-semibold text-slate-900 mb-1">Settings & Export</h1>
            <p class="text-sm text-slate-500 mb-6">Configure ATS parser strictness and resume export defaults.</p>
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200 shadow-sm">
              <div class="p-5 flex items-center justify-between">
                <div>
                  <div class="text-sm font-medium text-slate-900">Strict ATS Mode</div>
                  <div class="text-xs text-slate-500">Flag multi-column layouts and non-standard section headers.</div>
                </div>
                <input type="checkbox" ${state.settings.strictAts ? 'checked' : ''} class="h-4 w-4 accent-indigo-600" />
              </div>
              <div class="p-5 flex items-center justify-between">
                <div>
                  <div class="text-sm font-medium text-slate-900">Export Format</div>
                  <div class="text-xs text-slate-500">Default file format for downloaded resumes.</div>
                </div>
                <select class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white">
                  <option selected>PDF (ATS-Safe)</option>
                  <option>DOCX (Editable)</option>
                  <option>Plain Text</option>
                </select>
              </div>
            </div>
          </div>
        `);
      }

      function startAnalysis() {
        if (state.analysis.running) return;
        clearInterval(state.analysis.timerId);
        state.analysis = {
          running: true,
          progress: 5,
          stageIndex: 0,
          elapsed: 0,
          completed: false,
          cancelled: false,
          timerId: null
        };
        render();

        state.analysis.timerId = setInterval(() => {
          state.analysis.elapsed += 0.5;
          state.analysis.progress = Math.min(100, state.analysis.progress + 12);
          state.analysis.stageIndex = Math.min(
            ANALYSIS_STAGES.length - 1,
            Math.floor((state.analysis.progress / 100) * ANALYSIS_STAGES.length)
          );
          if (state.analysis.progress >= 100 && state.analysis.elapsed >= 4.0) {
            clearInterval(state.analysis.timerId);
            state.analysis.running = false;
            state.analysis.completed = true;
          }
          render();
        }, 500);
      }

      function cancelAnalysis() {
        clearInterval(state.analysis.timerId);
        state.analysis.running = false;
        state.analysis.cancelled = true;
        render();
      }

      function bindEvents() {
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
          loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            navigate('#/list');
          });
        }
        const demoBtn = document.getElementById('demo-signin');
        if (demoBtn) {
          demoBtn.addEventListener('click', () => navigate('#/list'));
        }
        const boostBtn = document.getElementById('boost-score-btn');
        if (boostBtn) {
          boostBtn.addEventListener('click', () => {
            if (state.score < 73) {
              state.score = 73;
              state.scoreHistory = [62, 65, 69, 73];
              state.suggestions[0].status = 'accepted';
            }
            render();
            const el = document.getElementById('ats-score-value');
            if (el) el.classList.add('score-pop');
          });
        }
        const runBtn = document.getElementById('run-analysis-btn');
        if (runBtn) runBtn.addEventListener('click', startAnalysis);

        const cancelBtn = document.getElementById('cancel-analysis-btn');
        if (cancelBtn) cancelBtn.addEventListener('click', cancelAnalysis);

        document.querySelectorAll('[data-accept]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-accept');
            const item = state.suggestions.find(s => s.id === id);
            if (item) item.status = 'accepted';
            render();
          });
        });
        document.querySelectorAll('[data-reject]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-reject');
            const item = state.suggestions.find(s => s.id === id);
            if (item) item.status = 'rejected';
            render();
          });
        });
      }

      function render() {
        state.renderState = getRenderState();
        state.route = normalizeRoute(window.location.hash);
        const app = document.getElementById('app');
        if (state.route === '#/login') app.innerHTML = renderLogin();
        else if (state.route === '#/list') app.innerHTML = renderList();
        else if (state.route === '#/detail/1') app.innerHTML = renderDetail();
        else if (state.route === '#/settings') app.innerHTML = renderSettings();
        bindEvents();
      }

      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      render();
    })();
  </script>
</body>
</html>
