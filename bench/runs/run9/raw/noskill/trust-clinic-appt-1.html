<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareDesk — Clinic Appointment Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @keyframes statusPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .status-pop {
      animation: statusPop 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="app"></div>

  <script>
    (function () {
      const VALID_STATES = ['default', 'empty', 'loading', 'long-loading', 'error', 'partial', 'locked'];

      const state = {
        route: '#/login',
        renderState: 'default',
        appointments: [
          { id: 1, time: '09:30 AM', patient: 'Elena Rostova', reason: 'Cardiology Follow-up', provider: 'Dr. M. Chen', status: 'Checked In' },
          { id: 2, time: '10:15 AM', patient: 'Marcus Vance', reason: 'Annual Physical', provider: 'Dr. S. Patel', status: 'Scheduled' },
          { id: 3, time: '11:00 AM', patient: 'Nadia Al-Mansoor', reason: 'Lab Review', provider: 'Dr. M. Chen', status: 'In Room' },
          { id: 4, time: '01:30 PM', patient: 'David Kim', reason: 'Orthopedic Consult', provider: 'Dr. R. Torres', status: 'Pending Auth' }
        ],
        visitStatus: 'Checked In',
        clinicalNote: 'Patient reports improved exercise tolerance over the past 14 days. BP 118/76 mmHg.',
        authOp: {
          running: false,
          progress: 0,
          stageIndex: 0,
          elapsed: 0,
          completed: false,
          cancelled: false,
          timerId: null
        }
      };

      const AUTH_STAGES = [
        'Verifying member eligibility & group policy…',
        'Submitting CPT-99214 & ICD-10 clinical codes…',
        'Awaiting payer clearinghouse adjudication…',
        'Recording pre-authorization reference number…'
      ];

      function getRenderState() {
        if (typeof window.__RENDER_STATE__ === 'string' && VALID_STATES.includes(window.__RENDER_STATE__)) {
          return window.__RENDER_STATE__;
        }
        const q = new URLSearchParams(window.location.search).get('state');
        if (q && VALID_STATES.includes(q)) return q;
        return 'default';
      }

      function normalizeRoute(hash) {
        const clean = (hash || '').split('?')[0];
        if (['#/login', '#/list', '#/detail/1', '#/settings'].includes(clean)) return clean;
        return '#/login';
      }

      function navigate(route) {
        if (window.location.hash !== route) window.location.hash = route;
        else {
          state.route = normalizeRoute(route);
          render();
        }
      }

      function statusBadge(status) {
        switch (status) {
          case 'In Room':
          case 'Completed':
            return 'bg-emerald-50 text-emerald-700 border-emerald-200';
          case 'Checked In':
            return 'bg-sky-50 text-sky-700 border-sky-200';
          case 'Pending Auth':
            return 'bg-amber-50 text-amber-700 border-amber-200';
          default:
            return 'bg-slate-100 text-slate-600 border-slate-200';
        }
      }

      function renderShell(activeRoute, contentHtml) {
        const nav = [
          { route: '#/list', label: 'Daily Schedule' },
          { route: '#/detail/1', label: 'Visit Detail #1' },
          { route: '#/settings', label: 'Clinic Settings' }
        ];
        return `
          <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
              <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
                <div class="flex items-center gap-6">
                  <a href="#/list" class="flex items-center gap-2 font-semibold text-slate-900">
                    <span class="w-7 h-7 rounded-lg bg-teal-600 text-white flex items-center justify-center">
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                      </svg>
                    </span>
                    <span>CareDesk</span>
                  </a>
                  <nav class="hidden sm:flex items-center gap-1">
                    ${nav.map(n => `
                      <a href="${n.route}" class="px-3 py-1.5 rounded-md text-sm font-medium ${activeRoute === n.route ? 'bg-teal-50 text-teal-700' : 'text-slate-600 hover:text-slate-900'}">${n.label}</a>
                    `).join('')}
                  </nav>
                </div>
                <div class="flex items-center gap-3">
                  <span class="hidden md:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
                    State: ${state.renderState}
                  </span>
                  <a href="#/login" class="text-xs font-medium text-slate-500 hover:text-slate-800 px-2.5 py-1.5 rounded-md border border-slate-200">Sign out</a>
                </div>
              </div>
            </header>
            <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
              ${contentHtml}
            </main>
          </div>
        `;
      }

      function renderStateBanner() {
        const rs = state.renderState;
        if (rs === 'loading') {
          return `
            <div class="space-y-4">
              <div class="h-8 w-52 rounded-lg skeleton"></div>
              <div class="h-64 rounded-xl skeleton"></div>
            </div>
          `;
        }
        if (rs === 'long-loading') {
          return `
            <div class="bg-white border border-slate-200 rounded-xl p-8 text-center max-w-lg mx-auto my-8 shadow-sm">
              <div class="w-10 h-10 mx-auto mb-4 rounded-full border-2 border-teal-600 border-t-transparent animate-spin"></div>
              <h2 class="text-base font-semibold text-slate-900">Syncing EHR & Payer Clearinghouse</h2>
              <p class="text-sm text-slate-500 mt-1">Retrieving today’s patient check-ins and insurance eligibility…</p>
            </div>
          `;
        }
        if (rs === 'error') {
          return `
            <div class="bg-rose-50 border border-rose-200 rounded-xl p-6 max-w-xl mx-auto my-6">
              <h3 class="text-sm font-semibold text-rose-900">EHR Connection Timeout</h3>
              <p class="text-sm text-rose-700 mt-1">Unable to reach the clinic scheduling server. Please retry or switch to offline triage.</p>
              <button onclick="window.location.search=''" class="mt-3 px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-medium">Retry</button>
            </div>
          `;
        }
        if (rs === 'locked') {
          return `
            <div class="bg-white border border-slate-200 rounded-xl p-8 max-w-lg mx-auto my-8 text-center shadow-sm">
              <h2 class="text-base font-semibold text-slate-900">Station Locked — HIPAA Timeout</h2>
              <p class="text-sm text-slate-500 mt-1">Your clinical session was locked after inactivity. Re-authenticate to view patient records.</p>
              <button onclick="window.location.hash='#/login'" class="mt-4 px-4 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium">Staff Sign-In</button>
            </div>
          `;
        }
        return null;
      }

      function renderLogin() {
        const special = renderStateBanner();
        if (special) return renderShell('#/login', special);
        return `
          <div class="min-h-screen flex items-center justify-center px-4 py-12 bg-slate-50">
            <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
              <div class="flex items-center gap-2.5 mb-6">
                <span class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold">+</span>
                <div>
                  <h1 class="text-lg font-semibold text-slate-900">CareDesk</h1>
                  <p class="text-xs text-slate-500">Clinic Appointment & Triage Console</p>
                </div>
              </div>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Staff ID or Email</label>
                  <input type="email" value="m.chen@caredesk-clinic.org" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300" required />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">PIN / Password</label>
                  <input type="password" value="••••••••••••" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300" required />
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700">Sign In to Station</button>
              </form>
            </div>
          </div>
        `;
      }

      function renderList() {
        const special = renderStateBanner();
        if (special) return renderShell('#/list', special);

        if (state.renderState === 'empty') {
          return renderShell('#/list', `
            <div class="bg-white border border-dashed border-slate-300 rounded-xl p-12 text-center max-w-lg mx-auto my-8">
              <h2 class="text-base font-semibold text-slate-900">No appointments scheduled today</h2>
              <p class="text-sm text-slate-500 mt-1">All patient slots are currently open.</p>
            </div>
          `);
        }

        const list = state.renderState === 'partial' ? state.appointments.slice(0, 2) : state.appointments;
        return renderShell('#/list', `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <h1 class="text-xl font-semibold text-slate-900">Today’s Schedule</h1>
              <p class="text-sm text-slate-500">Front-desk check-ins, rooming status, and payer pre-auth.</p>
            </div>
            <a href="#/detail/1" class="px-4 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700">Open Patient #1</a>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <div class="divide-y divide-slate-200">
              ${list.map(a => `
                <div class="p-4 sm:px-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-slate-50">
                  <div class="flex items-center gap-4">
                    <span class="text-xs font-mono font-semibold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-md">${a.time}</span>
                    <div>
                      <a href="#/detail/1" class="text-sm font-semibold text-slate-900 hover:text-teal-700">${a.patient}</a>
                      <p class="text-xs text-slate-500">${a.reason} • ${a.provider}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="px-2.5 py-0.5 text-xs font-medium rounded-full border ${statusBadge(a.id === 1 ? state.visitStatus : a.status)}">${a.id === 1 ? state.visitStatus : a.status}</span>
                    <a href="#/detail/1" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-700 hover:bg-slate-100">Chart</a>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `);
      }

      function renderDetail() {
        const special = renderStateBanner();
        if (special) return renderShell('#/detail/1', special);

        if (state.renderState === 'empty') {
          return renderShell('#/detail/1', `
            <div class="bg-white border border-dashed border-slate-300 rounded-xl p-10 text-center max-w-lg mx-auto my-8">
              <h2 class="text-base font-semibold text-slate-900">No clinical notes recorded</h2>
              <p class="text-sm text-slate-500 mt-1">Begin intake to record vitals and chief complaint.</p>
            </div>
          `);
        }

        const op = state.authOp;
        return renderShell('#/detail/1', `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <div class="text-xs text-slate-500 mb-1"><a href="#/list" class="hover:underline">Schedule</a> / Visit #1</div>
              <div class="flex items-center gap-3">
                <h1 class="text-xl font-semibold text-slate-900">Elena Rostova</h1>
                <span id="visit-status-badge" class="px-2.5 py-0.5 text-xs font-medium rounded-full border ${statusBadge(state.visitStatus)}">${state.visitStatus}</span>
              </div>
            </div>
            <div class="flex items-center gap-2.5">
              <button data-motion-trigger id="advance-status-btn" type="button" class="px-3.5 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">
                Move to In Room
              </button>
              <button id="run-auth-btn" type="button" ${op.running ? 'disabled' : ''} class="px-3.5 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700 disabled:opacity-50">
                ${op.running ? 'Authorizing…' : 'Run Insurance Pre-Auth'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <h2 class="text-sm font-semibold text-slate-900 mb-2">Clinical Intake Note</h2>
              <textarea id="clinical-note" rows="5" class="w-full p-3 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500">${state.clinicalNote}</textarea>
              <div class="mt-3 flex justify-end">
                <button id="save-note-btn" type="button" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-700 hover:bg-slate-100">Save Note</button>
              </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm h-fit">
              <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-semibold text-slate-900">Insurance Pre-Auth</h2>
                <span class="text-xs font-mono text-slate-500">${op.elapsed.toFixed(1)}s</span>
              </div>
              <p class="text-xs text-slate-500 mb-3">
                ${op.running ? AUTH_STAGES[op.stageIndex] : op.completed ? 'Approved • Auth #PA-884210' : op.cancelled ? 'Pre-auth cancelled.' : 'Submits live eligibility & CPT pre-authorization.'}
              </p>
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden mb-3">
                <div class="bg-teal-600 h-2 transition-all duration-300" style="width: ${op.progress}%"></div>
              </div>
              <div class="flex items-center justify-between text-xs">
                <span class="font-mono text-slate-500">${op.progress}%</span>
                ${op.running ? `<button id="cancel-auth-btn" type="button" class="text-rose-600 font-medium hover:underline">Cancel</button>` : ''}
              </div>
            </div>
          </div>
        `);
      }

      function renderSettings() {
        const special = renderStateBanner();
        if (special) return renderShell('#/settings', special);
        return renderShell('#/settings', `
          <div class="max-w-2xl">
            <h1 class="text-xl font-semibold text-slate-900 mb-1">Clinic Hours & Notifications</h1>
            <p class="text-sm text-slate-500 mb-6">Configure operating hours and SMS appointment reminders.</p>
            <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-4 shadow-sm">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-sm font-medium text-slate-900">SMS Check-in Reminders</div>
                  <div class="text-xs text-slate-500">Send automated reminder 24 hours before visit.</div>
                </div>
                <input type="checkbox" checked class="h-4 w-4 accent-teal-600" />
              </div>
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-sm font-medium text-slate-900">Clinic Operating Hours</div>
                  <div class="text-xs text-slate-500">Monday – Friday</div>
                </div>
                <span class="text-sm font-mono text-slate-700">08:00 – 17:30</span>
              </div>
            </div>
          </div>
        `);
      }

      function startAuthOp() {
        if (state.authOp.running) return;
        clearInterval(state.authOp.timerId);
        state.authOp = { running: true, progress: 10, stageIndex: 0, elapsed: 0, completed: false, cancelled: false, timerId: null };
        render();
        state.authOp.timerId = setInterval(() => {
          state.authOp.elapsed += 0.5;
          state.authOp.progress = Math.min(100, state.authOp.progress + 14);
          state.authOp.stageIndex = Math.min(AUTH_STAGES.length - 1, Math.floor((state.authOp.progress / 100) * AUTH_STAGES.length));
          if (state.authOp.progress >= 100 && state.authOp.elapsed >= 3.5) {
            clearInterval(state.authOp.timerId);
            state.authOp.running = false;
            state.authOp.completed = true;
          }
          render();
        }, 500);
      }

      function bindEvents() {
        const loginForm = document.getElementById('login-form');
        if (loginForm) loginForm.addEventListener('submit', (e) => { e.preventDefault(); navigate('#/list'); });

        const advBtn = document.getElementById('advance-status-btn');
        if (advBtn) {
          advBtn.addEventListener('click', () => {
            state.visitStatus = state.visitStatus === 'Checked In' ? 'In Room' : 'Completed';
            render();
            const badge = document.getElementById('visit-status-badge');
            if (badge) badge.classList.add('status-pop');
          });
        }

        const runBtn = document.getElementById('run-auth-btn');
        if (runBtn) runBtn.addEventListener('click', startAuthOp);

        const cancelBtn = document.getElementById('cancel-auth-btn');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            clearInterval(state.authOp.timerId);
            state.authOp.running = false;
            state.authOp.cancelled = true;
            render();
          });
        }

        const noteEl = document.getElementById('clinical-note');
        const saveNoteBtn = document.getElementById('save-note-btn');
        if (saveNoteBtn && noteEl) {
          saveNoteBtn.addEventListener('click', () => {
            state.clinicalNote = noteEl.value;
          });
        }
      }

      function render() {
        state.renderState = getRenderState();
        state.route = normalizeRoute(window.location.hash);
        const app = document.getElementById('app');
        if (state.route === '#/login') app.innerHTML = renderLogin();
        else if (state.route === '#/list') app.innerHTML = renderList();
        else if (state.route === '#/detail/1') app.innerHTML = renderDetail();
        else if (state.route === '#/settings') app.innerHTML = renderSettings();
        bindEvents();
      }

      window.addEventListener('hashchange', render);
      window.addEventListener('DOMContentLoaded', render);
      render();
    })();
  </script>
</body>
</html>
